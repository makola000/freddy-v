<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Revenus - FREDDY-V</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;padding:20px;text-align:center}
.box{background:#1f1f1f;padding:20px;border-radius:15px;margin-top:20px}
h1{color:#ff0000}
.money{font-size:40px;color:#00ff00;font-weight:bold}
.btn{background:#ff0000;color:#fff;padding:12px 20px;border-radius:20px;text-decoration:none;display:inline-block;margin-top:20px}
</style>
</head>
<body>
<h1>💰 MES REVENUS</h1>
<a class="btn" href="index.html">Retour aux vidéos</a>
<div class="box">
<p>Vues totales:</p>
<div class="money" id="vues">Chargement...</div>
<p>Mon argent (80%):</p>
<div class="money" id="argent">$0.00</div>
<p>Part FREDDY-V (20%):</p>
<div id="freddy">$0.00</div>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",
authDomain: "freddy-v.firebaseapp.com",
projectId: "freddy-v",
storageBucket: "freddy-v.firebasestorage.app",
messagingSenderId: "318263144332",
appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.collection("revenus").doc("makola").onSnapshot((doc)=>{
if(doc.exists){
const d=doc.data();
document.getElementById("vues").innerText=d.vuesTotales||0;
document.getElementById("argent").innerText="$"+(d.monArgent||0).toFixed(2);
document.getElementById("freddy").innerText="$"+(d.partFreddyV||0).toFixed(2);
}else{
document.getElementById("vues").innerText="0";
document.getElementById("argent").innerText="$0.00";
}
});
</script>
</body>
</html>
