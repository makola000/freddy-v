<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Connexion FREDDY-V</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-white flex items-center justify-center min-h-screen p-4">
<div class="w-full max-w-sm">
<h1 class="font-black text-2xl mb-4 text-center"><span class="bg-red-600 text-white px-2 rounded">FREDDY-V</span></h1>
<div id="info" class="text-sm mb-3"></div>
<input id="email" type="email" placeholder="Email" value="kibwemakola@gmail.com" class="w-full border p-3 rounded mb-2">
<input id="pass" type="password" placeholder="Mot de passe" class="w-full border p-3 rounded mb-3">
<button onclick="login()" class="w-full bg-black text-white p-3 rounded font-bold">Se connecter et rester connecté</button>
<p class="text-xs text-gray-500 mt-3 text-center">Une fois connecté, tu n'auras plus besoin de retaper. Ton compte restera enregistré sur ton téléphone comme YouTube.</p>
</div>
<script>
const saved = localStorage.getItem('freddy_user');
if(saved){ document.getElementById('info').innerHTML="✅ Déjà connecté: <b>"+saved+"</b><br><a href='publier.html' class='text-blue-600 font-bold'>Aller publier →</a> | <a href='#' onclick='logout()' class='text-red-600'>Se déconnecter</a>"; }
function login(){
 const e=document.getElementById('email').value.trim();
 const p=document.getElementById('pass').value.trim();
 if(!e || !p){ alert("Remplis email + mot de passe"); return; }
 // On enregistre pour toujours
 localStorage.setItem('freddy_user', e);
 localStorage.setItem('freddy_pass', btoa(p)); // crypté simple
 alert("✅ Connecté! Maintenant va publier, tu n'auras plus besoin de mot de passe");
 location.href="publier.html";
}
function logout(){ localStorage.removeItem('freddy_user'); localStorage.removeItem('freddy_pass'); location.reload(); }
</script>
</body></html>
