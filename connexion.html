<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Connexion - FREDDY-V</title><script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v",storageBucket:"freddy-v.firebasestorage.app",messagingSenderId:"318263144332",appId:"1:318263144332:web:387b2ded7cf5b85d6eb0a9"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
window.seConnecter=async()=>{
const tel=document.getElementById('tel').value.trim();const msg=document.getElementById('msg');const btn=document.getElementById('btnCo');
if(!tel){msg.innerHTML=`<div class='bg-red-100 text-red-700 p-3 rounded'>Mets ton numéro WhatsApp</div>`;return;}
btn.textContent="Vérification...";btn.disabled=true;
try{const d=await getDoc(doc(db,"utilisateurs",tel));if(!d.exists()){msg.innerHTML=`<div class='bg-red-100 p-3 rounded'>Compte non trouvé. Inscris-toi d'abord.</div>`;btn.textContent="Se connecter";btn.disabled=false;return;}
localStorage.setItem('freddy_tel',tel);localStorage.setItem('freddy_nom',d.data().nom);
msg.innerHTML=`<div class='bg-green-100 p-3 rounded'>Bienvenue ${d.data().nom}!</div>`;setTimeout(()=>location.href="ma-chaine.html",800);
}catch(e){msg.innerHTML=`<div class='bg-red-100 p-3 rounded'>Erreur: ${e.message}</div>`;btn.textContent="Se connecter";btn.disabled=false;}
}
</script></head>
<body class="bg-black text-white min-h-screen p-4"><div class="max-w-md mx-auto mt-10">
<h1 class="text-3xl font-black text-center">CONNEXION</h1><div class="bg-white text-black p-6 rounded-2xl mt-6">
<label class="font-bold">Numéro WhatsApp</label><input id="tel" type="tel" placeholder="097xxxxxxx" class="w-full p-3 border rounded-xl mt-1 mb-4">
<button id="btnCo" onclick="seConnecter()" class="w-full bg-black text-white p-4 rounded-xl font-black">SE CONNECTER</button><div id="msg" class="mt-4"></div>
<p class="text-xs text-center mt-4">Pas de compte? <a href="inscription.html" class="text-red-600 font-bold">Créer</a></p></div><a href="index.html" class="block text-center mt-6 text-gray-400">← Accueil</a></div></body></html>
