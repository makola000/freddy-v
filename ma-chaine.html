<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ma Chaîne - FREDDY-V</title><script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v",storageBucket:"freddy-v.firebasestorage.app",messagingSenderId:"318263144332",appId:"1:318263144332:web:387b2ded7cf5b85d6eb0a9"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
window.onload=async()=>{
const tel=localStorage.getItem('freddy_tel');const nom=localStorage.getItem('freddy_nom');
if(!tel){location.href="connexion.html";return;}
document.getElementById('nom').innerText=nom||tel;
document.getElementById('tel').innerText=tel;
try{
const rev=await getDoc(doc(db,"revenus",tel));
if(rev.exists()){
const d=rev.data();
document.getElementById('vues').innerText=d.vuesTotales||0;
document.getElementById('argent').innerText=(d.monArgent||0).toFixed(3)+" $";
document.getElementById('freddy').innerText=(d.partFreddyV||0).toFixed(3)+" $ (20% pour Freddy-V)";
} else {document.getElementById('vues').innerText="0";document.getElementById('argent').innerText="0.000 $";}

const admin=await getDoc(doc(db,"revenus","ADMIN_MAKOLA"));
if(admin.exists() && tel==="ADMIN_MAKOLA" || nom==="Makola Admin" || tel==="0970000000"){
document.getElementById('adminBox').classList.remove('hidden');
document.getElementById('adminGain').innerText=(admin.data().partFreddyV||0).toFixed(3)+" $";
}

const q=query(collection(db,"videos"), where("ownerTel","==",tel));
const snap=await getDocs(q);
let html=""; snap.forEach(d=>{const v=d.data(); html+=`<div class="bg-white text-black p-3 rounded-xl mb-2"><b>${v.titre}</b><br><span class="text-xs">${v.vues||0} vues - ${(v.revenusOwner||0).toFixed(3)} $</span></div>`;});
document.getElementById('mesvideos').innerHTML=html||"<p class='text-gray-400 text-sm'>Pas encore de vidéo. <a href='publier.html' class='text-red-500'>Publie!</a></p>";
}catch(e){document.getElementById('mesvideos').innerHTML="Erreur: "+e.message;}
}
window.deconnexion=()=>{localStorage.clear(); location.href="index.html";}
</script></head>
<body class="bg-black text-white min-h-screen p-4"><div class="max-w-md mx-auto">
<h1 class="text-2xl font-black">Ma Chaîne</h1>
<div class="bg-white text-black p-5 rounded-2xl mt-4">
<p class="font-bold text-lg" id="nom"></p><p class="text-xs text-gray-500" id="tel"></p>
<div class="grid grid-cols-2 gap-3 mt-4">
<div class="bg-black text-white p-3 rounded-xl text-center"><p class="text-xs">Vues totales</p><p id="vues" class="font-black text-xl">0</p></div>
<div class="bg-red-600 text-white p-3 rounded-xl text-center"><p class="text-xs">Mon Argent (80%)</p><p id="argent" class="font-black text-xl">0 $</p></div>
</div>
<p class="text-xs text-gray-500 mt-2" id="freddy"></p>
<div id="adminBox" class="hidden mt-4 bg-yellow-100 p-3 rounded-xl"><p class="font-bold text-sm">🔥 ADMIN MAKOLA - Gains 20%:</p><p id="adminGain" class="font-black"></p></div>
<button onclick="deconnexion()" class="mt-4 w-full bg-gray-200 p-3 rounded-xl text-sm">Déconnexion</button>
</div>
<h3 class="font-bold mt-6 mb-2">Mes vidéos</h3><div id="mesvideos"></div>
<a href="index.html" class="block text-center mt-6 text-gray-400">← Accueil</a>
<a href="publier.html" class="block bg-red-600 text-white text-center p-4 rounded-xl mt-2 font-black">+ PUBLIER UNE VIDÉO</a>
</div></body></html>
