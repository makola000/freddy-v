<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma Chaîne - FREDDY-V</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<style>body{background:#000;color:#fff;font-family:Arial;padding:15px} .box{background:#111;padding:15px;border-radius:15px;margin-top:10px} input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:0} button{background:red;color:#fff;font-weight:bold} .small{font-size:12px;color:#aaa}</style>
</head><body>
<h2 style="color:red">FREDDY-V - Publier</h2>
<a href="index.html" style="color:#aaa">← Retour accueil</a>

<div class="box">
<p><b>1. Vidéo de ton téléphone:</b></p>
<input type="file" id="fileInput" accept="video/*">
<p class="small">Choisis une vidéo dans ta galerie</p>
<hr style="border:0;border-top:1px solid #333;margin:15px 0">
<p><b>2. Ou lien YouTube Shorts:</b></p>
<input type="text" id="ytInput" placeholder="https://youtube.com/shorts/...">
<p class="small">Colle le lien si tu veux copier YouTube</p>
<hr style="border:0;border-top:1px solid #333;margin:15px 0">
<input type="text" id="title" placeholder="Titre de la vidéo (ex: Choisir section du câble)">
<button id="pubBtn" onclick="publier()">PUBLIER MAINTENANT</button>
<p id="status"></p>
</div>

<script>
const cfg={apiKey:"AIzaSyCZTfMR94q2t4W1c0N7LK5YpN14M8iBVvA",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v",storageBucket:"freddy-v.appspot.com"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.firestore(); const storage=firebase.storage();
function getYTId(url){
 if(!url) return null;
 let m=url.match(/shorts\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
 m=url.match(/v=([a-zA-Z0-9_-]+)/); if(m) return m[1];
 m=url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
 return null;
}
async function publier(){
 const file=document.getElementById('fileInput').files[0];
 const ytLink=document.getElementById('ytInput').value.trim();
 const title=document.getElementById('title').value.trim()||'Vidéo FREDDY-V';
 const btn=document.getElementById('pubBtn'); const st=document.getElementById('status');
 if(!file && !ytLink){st.innerHTML='❌ Choisis une vidéo OU colle un lien YouTube';return;}
 btn.disabled=true; btn.innerText='⏳ Publication...'; st.innerHTML='Patiente...';
 try{
  let data={title:title, ownerName:'FREDDY-V', views:0, likes:0, created: firebase.firestore.FieldValue.serverTimestamp()};
  if(file){
   st.innerHTML='📤 Upload de ta vidéo téléphone...';
   const ref=storage.ref('videos/'+Date.now()+'_'+file.name);
   await ref.put(file);
   const url=await ref.getDownloadURL();
   data.videoUrl=url; data.youtubeId=null;
  }else{
   const yid=getYTId(ytLink);
   if(!yid){st.innerHTML='❌ Lien YouTube invalide'; btn.disabled=false; btn.innerText='PUBLIER MAINTENANT'; return;}
   data.youtubeId=yid; data.videoUrl=null;
  }
  await db.collection('videos').add(data);
  st.innerHTML='✅ Vidéo publiée! Redirection...';
  setTimeout(()=>{window.location.href='index.html';},1500);
 }catch(e){
  st.innerHTML='❌ Erreur: '+e.message+'<br>Vérifie Firebase Rules et Storage Rules en mode true'; 
  btn.disabled=false; btn.innerText='PUBLIER MAINTENANT';
 }
}
</script>
</body></html>
