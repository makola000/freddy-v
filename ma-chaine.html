<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma Chaîne - FREDDY-V</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<style>body{background:#000;color:#fff;font-family:Arial;padding:15px} .box{background:#111;padding:20px;border-radius:15px} input,button{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:0;box-sizing:border-box} button{background:red;color:#fff;font-weight:bold;font-size:16px} #status{margin-top:15px;padding:10px;background:#222;border-radius:10px;font-size:13px;white-space:pre-wrap}</style>
</head><body>
<h2 style="color:red">FREDDY-V Publier</h2>
<a href="index.html" style="color:#aaa">← Accueil</a>
<div class="box">
<p>Choisis vidéo de ton téléphone:</p>
<input type="file" id="file" accept="video/*">
<input type="text" id="title" placeholder="Titre (ex: Ma vidéo électricité)">
<button onclick="upload()">PUBLIER</button>
<div id="status">En attente...</div>
</div>
<script>
const cfg={apiKey:"AIzaSyCZTfMR94q2t4W1c0N7LK5YpN14M8iBVvA",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v",storageBucket:"freddy-v.appspot.com"};
firebase.initializeApp(cfg);
const db=firebase.firestore();
const storage=firebase.storage();
async function upload(){
 const f=document.getElementById('file').files[0];
 const title=document.getElementById('title').value||'Vidéo FREDDY-V';
 const st=document.getElementById('status');
 if(!f){st.innerText='❌ Choisis d\'abord une vidéo';return;}
 if(f.size>80*1024*1024){st.innerText='❌ Vidéo trop grosse (max 80MB). Coupe la vidéo plus courte.';return;}
 st.innerText='⏳ Début upload...\nTaille: '+(f.size/1024/1024).toFixed(1)+' MB';
 try{
  const name=Date.now()+'_'+f.name.replace(/[^a-z0-9.]/gi,'_');
  const ref=storage.ref('videos/'+name);
  const task=ref.put(f);
  task.on('state_changed', (snap)=>{
   const pct=Math.round(snap.bytesTransferred/snap.totalBytes*100);
   st.innerText=`📤 Upload: ${pct}%\n${(snap.bytesTransferred/1024/1024).toFixed(1)} / ${(snap.totalBytes/1024/1024).toFixed(1)} MB`;
  }, (err)=>{
   st.innerText='❌ Erreur Storage: '+err.message+'\n\nVérifie:\n1. Firebase Console > Storage > Rules = allow read, write: if true\n2. Storage > est activé';
  }, async ()=>{
   st.innerText='✅ Upload fini, sauvegarde...';
   const url=await ref.getDownloadURL();
   await db.collection('videos').add({title:title, videoUrl:url, youtubeId:null, ownerName:'FREDDY-V', views:0, likes:0, created:firebase.firestore.FieldValue.serverTimestamp()});
   st.innerText='✅ VIDÉO PUBLIÉE!\nRedirection vers accueil...';
   setTimeout(()=>{location.href='index.html';},1500);
  });
 }catch(e){
  st.innerText='❌ Erreur: '+e.message+'\n\nSi erreur dit "bucket", va dans Firebase > Project Settings > General > regarde Default Bucket name et dis-moi le nom.';
 }
}
</script>
</body></html>
