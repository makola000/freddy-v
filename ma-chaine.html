<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Chaîne - FREDDY-V</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 pb-20">

<header class="bg-white sticky top-0 z-40 border-b px-3 py-2.5 flex justify-between items-center">
<a href="index.html" class="flex items-center gap-2">
<span class="bg-red-600 text-white font-black px-3 py-1 rounded-md text-sm">FREDDY</span>
<span class="font-black text-sm">-V</span>
</a>
<a href="publier.html" class="bg-black text-white px-4 py-1.5 rounded-full text-sm font-bold"><i class="fa fa-plus mr-1"></i> Publier</a>
</header>

<!-- BANNER CHAINE -->
<div class="bg-gradient-to-r from-red-600 to-black h-32"></div>

<div class="bg-white p-4 -mt-10 relative mx-3 rounded-xl shadow">
<div class="flex gap-4 items-end">
<img src="https://ui-avatars.com/api/?name=Makola+Freddy&background=ff0000&color=fff&size=80" class="w-20 h-20 rounded-full border-4 border-white -mt-10">
<div>
<h1 class="font-black text-lg">Makola Freddy Officiel</h1>
<p class="text-xs text-gray-500">@makolafreddy • <span id="nbVideos">0</span> vidéos • <span id="totalVues">0</span> vues</p>
<p class="text-xs mt-1">Bienvenue sur ma chaîne FREDDY-V! 🙏 Prédications, motivations, vie.</p>
</div>
</div>
<button onclick="window.location='publier.html'" class="w-full mt-4 bg-red-600 text-white py-2.5 rounded-full font-bold text-sm">+ Publier une vidéo sur ma chaîne</button>
</div>

<div id="player" class="hidden bg-black sticky top-[49px] z-50">
<div id="playerBox" class="w-full"></div>
<button onclick="closePlayer()" class="w-full bg-zinc-800 text-white text-xs py-3">Fermer</button>
</div>

<div class="bg-white mt-3 p-3">
<h2 class="font-black text-sm mb-3">Mes Vidéos</h2>
<div id="mesVideos" class="grid grid-cols-1 gap-3"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM", authDomain: "freddy-v.firebaseapp.com", projectId: "freddy-v", storageBucket: "freddy-v.firebasestorage.app", messagingSenderId: "318263144332", appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getId(url){ if(!url) return ""; let id=""; if(url.includes("youtu.be/")) id=url.split("youtu.be/")[1].split("?")[0].split("&")[0]; else if(url.includes("watch?v=")) id=url.split("watch?v=")[1].split("&")[0].split("?")[0]; else if(url.includes("shorts/")) id=url.split("shorts/")[1].split("?")[0].split("&")[0]; return id.substring(0,11); }
function toEmbed(url){ return "https://www.youtube.com/embed/"+getId(url); }
window.closePlayer=function(){ document.getElementById('player').classList.add('hidden'); document.getElementById('playerBox').innerHTML=''; }
window.playVideo=function(url){ const embed=toEmbed(url); document.getElementById('playerBox').innerHTML=`<iframe src="${embed}?autoplay=1" class="w-full h-[280px]" frameborder="0" allowfullscreen></iframe>`; document.getElementById('player').classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'}); }

async function load(){
  const snap = await getDocs(collection(db,"videos"));
  let html=""; let nb=0; let vues=0;
  snap.forEach(d=>{
    const v=d.data();
    if((v.auteur||"").toLowerCase().includes("makola") || (v.auteur||"").toLowerCase().includes("freddy")){
      const vidId=getId(v.url); if(!vidId) return;
      const thumb=`https://img.youtube.com/vi/${vidId}/mqdefault.jpg`;
      nb++; vues+=(v.vues||0);
      html+=`<div onclick="playVideo('${v.url}')" class="flex gap-3 border-b pb-3 cursor-pointer"><img src="${thumb}" class="w-32 h-20 rounded-lg object-cover"><div><h3 class="font-bold text-sm line-clamp-2">${v.titre}</h3><p class="text-xs text-gray-500 mt-1">${v.vues||0} vues • ${v.type}</p></div></div>`;
    }
  });
  document.getElementById('mesVideos').innerHTML=html||"<p class='text-xs text-gray-400'>Pas encore de vidéos. Publie ta première!</p>";
  document.getElementById('nbVideos').innerText=nb;
  document.getElementById('totalVues').innerText=vues;
}
load();
</script>
</body>
</html>
