<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN FREDDY-V INTERNATIONAL</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px}
.card{background:#1a1a1a;padding:12px;margin:10px 0;border-radius:8px;border-left:4px solid red}
.btn{background:red;color:#fff;border:none;padding:8px 12px;border-radius:5px;margin:3px}
.pay{background:#00aa00}
h2{color:red;text-align:center}
</style>
</head>
<body>
<h2>👑 ADMIN FREDDY-V - INTERNATIONAL</h2>
<p style="font-size:12px;text-align:center">Airtel: 0983356734 | WU + MoneyGram + Banque</p>
<input id="rate" value="1" style="width:60px"> <span style="font-size:12px">Taux: 1000 vues = 1$</span>
<button class="btn" onclick="load()">Actualiser</button>
<div id="list">Chargement...</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getFirestore,collection,getDocs,doc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB83-...",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

async function load(){
const snap=await getDocs(collection(db,"users"));
let html="";
snap.forEach(d=>{
let u=d.data();
let id=d.id;
let vues=u.vues||0;
let rate=parseFloat(document.getElementById("rate").value)||1;
let apayer=(vues/1000*rate).toFixed(2);
html+=`<div class="card">
<b>${u.nom||"Sans nom"}</b> - ${u.pays||"RDC"} - ${u.whatsapp||""}<br>
💳 <b>${u.paiement||u.modePaiement||"Airtel Money"}</b> : ${u.details||u.numero||u.airtel||""}<br>
👁️ ${vues} vues = <b style="color:#0f0">${apayer}$ à payer</b><br>
<button class="btn pay" onclick="payer('${id}',${vues})">✅ J'AI PAYÉ ${apayer}$ via ${u.paiement||""}</button>
<button class="btn" onclick="supprimer('${id}')">Supprimer</button>
</div>`;
});
document.getElementById("list").innerHTML=html||"Aucun créateur";
}
window.load=load;
window.payer=async(id,vues)=>{
if(confirm("Confirmer paiement?")){
await updateDoc(doc(db,"users",id),{vues:0});
load();
}};
window.supprimer=async(id)=>{
if(confirm("Supprimer?")){
await deleteDoc(doc(db,"users",id));
load();
}};
load();
</script>
</body>
</html>
