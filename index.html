<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V - Générateur Nimbo & Cours</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:white;padding-bottom:80px}
.banner{background:#e60000;color:white;text-align:center;padding:8px;font-weight:800;font-size:13px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#1e1e1e;position:sticky;top:0}
.logo{font-weight:900;color:#a78bfa;font-size:20px}
.search-box{padding:12px;background:#1e1e1e}
.search-box input{width:100%;padding:12px;border-radius:10px;border:none;background:#2a2a2a;color:white}
.generator{background:#1e1e1e;margin:12px;border-radius:14px;padding:14px;border:1px solid #333}
.generator input,.generator select{width:100%;padding:11px;border-radius:8px;border:none;background:#2a2a2a;color:white;margin-bottom:10px}
.gen-btn{background:linear-gradient(135deg,#ff0055,#a855f7);color:white;border:none;padding:13px;width:100%;border-radius:10px;font-weight:900;cursor:pointer}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 12px 10px}
.cat{white-space:nowrap;padding:6px 14px;border-radius:20px;background:#2a2a2a;border:none;color:#aaa;font-size:13px}
.cat.active{background:white;color:black;font-weight:700}
.video-card{background:#1e1e1e;margin:12px;border-radius:12px;overflow:hidden;border:1px solid #2a2a2a}
.thumb{height:180px;background:linear-gradient(135deg,#3b0764,#7e22ce);display:flex;align-items:center;justify-content:center;font-size:60px;position:relative}
.duration{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.8);padding:2px 6px;border-radius:4px;font-size:12px}
.info{padding:10px}.views{color:#22c55e;font-weight:700}
.bottom{display:flex;justify-content:space-around;background:#1e1e1e;padding:8px 0;position:fixed;bottom:0;width:100%;border-top:1px solid #333}
</style>
</head>
<body>
<div class="banner">1000 vues = 1$ | CREATEUR GAGNE 80% (0,80$) | Paiement LUNDI Airtel:0983356734 - WU - MoneyGram</div>
<div class="header"><div class="logo">📹 FREDDY-V</div><div>🔔 👤</div></div>
<div class="search-box">
<input id="searchInput" placeholder="🔍 Cherche: Nimbo 50, cours soudure..." oninput="filterVideos()">
</div>
<div class="generator">
<h3 style="color:#facc15;margin-bottom:10px">✨ Générer & Publier IA</h3>
<input id="titleInput" placeholder="Titre: Nimbo za Kitabu 123, Cours Électricité...">
<select id="typeSelect">
<option value="Nimbo za Kitabu">🎵 Nimbo za Kitabu</option>
<option value="Gospel">🙏 Gospel</option>
<option value="Cours Technique">🔧 Cours Technique (5-10 min)</option>
<option value="Musique">🎤 Musique</option>
<option value="Sagesse">📖 Sagesse</option>
</select>
<button class="gen-btn" onclick="generateVideo()">+ Générer et Publier Maintenant</button>
</div>
<div class="cats">
<button class="cat active" onclick="filterCat('Tous',this)">Tous</button>
<button class="cat" onclick="filterCat('Nimbo za Kitabu',this)">Nimbo</button>
<button class="cat" onclick="filterCat('Gospel',this)">Gospel</button>
<button class="cat" onclick="filterCat('Cours Technique',this)">Cours</button>
</div>
<div id="videoList"></div>
<div class="bottom"><div>🏠 Accueil</div><div>➕ Publier</div><div>💰 Gains</div><div>👤 Profil</div></div>
<script>
let videos=JSON.parse(localStorage.getItem('freddy_v_videos')||'[]');
if(videos.length===0){videos=[{id:1,title:"Nimbo za Kitabu 1 - Mungu ni Mwema",type:"Nimbo za Kitabu",views:1250,duration:"4:32",icon:"🎵"},{id:2,title:"Cours Technique: Soudure de base 5 min",type:"Cours Technique",views:890,duration:"5:15",icon:"🔧"},{id:3,title:"Gospel Morning - Louange du Dimanche",type:"Gospel",views:3420,duration:"6:20",icon:"🙏"}];save();}
function save(){localStorage.setItem('freddy_v_videos',JSON.stringify(videos));}
function generateVideo(){const title=document.getElementById('titleInput').value.trim();const type=document.getElementById('typeSelect').value;if(!title){alert('Écris le titre!');return;}const icons={"Nimbo za Kitabu":"🎵","Gospel":"🙏","Cours Technique":"🔧","Musique":"🎤","Sagesse":"📖"};const durations={"Nimbo za Kitabu":"3:45","Gospel":"5:20","Cours Technique":"7:30"};const newVideo={id:Date.now(),title:title,type:type,views:0,duration:durations[type]||"5:00",icon:icons[type]||"🎬"};videos.unshift(newVideo);save();document.getElementById('titleInput').value='';render();alert('✅ Publié! '+title);}
function render(){const list=document.getElementById('videoList');const search=document.getElementById('searchInput').value.toLowerCase();let filtered=videos.filter(v=>(currentCat==='Tous'||v.type===currentCat)&&(v.title.toLowerCase().includes(search)));if(filtered.length===0){list.innerHTML='<div style="text-align:center;padding:40px;color:#666">Aucune vidéo. Publie la première!</div>';return;}list.innerHTML=filtered.map(v=>`<div class="video-card" onclick="addView(${v.id})"><div class="thumb">${v.icon}<span class="duration">${v.duration}</span></div><div style="padding:10px"><h4 style="font-size:14px">${v.title}</h4><div style="font-size:12px;color:#888"><span>${v.type}</span> • <span style="color:#22c55e;font-weight:700">${v.views} vues</span> • <span style="color:#facc15">${(v.views*0.0008).toFixed(2)}$</span></div></div></div>`).join('');}
function addView(id){const v=videos.find(x=>x.id===id);if(v){v.views++;save();render();}}
let currentCat='Tous';function filterCat(cat,btn){currentCat=cat;document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function filterVideos(){render();}render();
</script>
</body>
</html>
