<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V - Vidéos du Monde</title>
<style>
body{margin:0;font-family:Arial;background:#000;color:#fff}
header{background:#ff0000;padding:10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
header a{color:white;text-decoration:none;margin:0 8px;font-weight:bold}
.video-box{width:100%;max-width:500px;margin:15px auto;background:#111;border-radius:10px;overflow:hidden}
video{width:100%;display:block}
.info{padding:10px}
.stats{color:#0f0;font-size:13px}
button{padding:8px 15px;border:none;border-radius:5px;cursor:pointer}
.btn-view{background:#ff0000;color:white;width:100%;margin-top:5px}
</style>
</head>
<body>
<header>
<b>FREDDY-V 🌍</b>
<div>
<a href="revenus.html">💰 Revenus</a>
<a href="admin-revenus.html" id="adminLink" style="display:none">👑 Admin</a>
<a href="connexion.html" id="loginLink">Connexion</a>
</div>
</header>

<div id="videos"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEecIHM",
  authDomain: "freddy-v.firebaseapp.com",
  projectId: "freddy-v",
  storageBucket: "freddy-v.firebasestorage.app",
  messagingSenderId: "318263144332",
  appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
onAuthStateChanged(auth, (user)=>{
  currentUser = user;
  if(user){
    document.getElementById("loginLink").innerText = "Déconnexion";
    if(user.email === "makola000@gmail.com" || user.uid === "ADMIN"){
       document.getElementById("adminLink").style.display = "inline";
    }
  }
});

async function chargerVideos(){
  const snap = await getDocs(collection(db, "videos"));
  let html = "";
  snap.forEach(d=>{
    const v = d.data();
    const vues = v.vues || 0;
    const gainTotal = vues * 0.01;
    html += `
    <div class="video-box">
      <video src="${v.url}" controls poster="${v.miniature || ''}" data-id="${d.id}"></video>
      <div class="info">
        <b>${v.titre || 'Vidéo FREDDY-V'}</b><br>
        <span class="stats">${vues} vues • $${gainTotal.toFixed(2)} généré (80% pour ${v.nom || 'créateur'} / 20% FREDDY-V)</span><br>
        <button class="btn-view" onclick="compterVue('${d.id}')">▶️ Regarder = Compter $0.01</button>
      </div>
    </div>`;
  });
  document.getElementById("videos").innerHTML = html || "<p style='text-align:center'>Aucune vidéo encore. Publie ta première!</p>";
  
  // COMPTEUR AUTOMATIQUE AU PLAY
  document.querySelectorAll("video").forEach(video=>{
    video.addEventListener("play", async ()=>{
      const id = video.getAttribute("data-id");
      compterVue(id);
    }, {once:true});
  });
}

window.compterVue = async (idVideo)=>{
  try{
    const ref = doc(db, "videos", idVideo);
    await updateDoc(ref, { vues: increment(1) });
    console.log("Vue comptée +$0.01");
    // Optionnel: log pour admin
    await addDoc(collection(db, "vues_logs"), { videoId: idVideo, date: serverTimestamp(), gain: 0.01 });
    setTimeout(chargerVideos, 500);
  }catch(e){ console.log(e); }
};

chargerVideos();
</script>
</body>
</html>
