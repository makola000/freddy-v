<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY V - KOLWEZI | Gagne avec AdSense</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB83-zVJMqqDR6E0nEzDefjH5Vv_nQAws4",
  authDomain: "freddy-v-kolwezi.firebaseapp.com",
  projectId: "freddy-v-kolwezi",
  storageBucket: "freddy-v-kolwezi.firebasestorage.app",
  messagingSenderId: "89153368888",
  appId: "1:89153368888:web:1e23139f916d6d303507cd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.fs = { collection, addDoc, getDocs, query, orderBy };

async function loadVideos(){
  const grid = document.getElementById('grid');
  try{
    const q = query(collection(db, "videos"), orderBy("date","desc"));
    const snap = await getDocs(q);
    grid.innerHTML = "";
    snap.forEach(d=>{
      const v = d.data();
      const id = v.youtubeId || v.url?.split('v=')[1]?.split('&')[0] || "";
      grid.innerHTML += `<div class="card"><div class="thumb"><iframe src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe></div><div class="info"><h3>${v.title}</h3><p>${v.category||'FREDDY-V'}</p></div></div>`;
    });
    if(snap.empty){ grid.innerHTML="<div style='grid-column:1/-1;padding:40px;color:#888'>Aucune vidéo. Sois le premier!</div>"; }
  }catch(e){ console.log(e); }
}

window.publish = async ()=>{
  const t = document.getElementById('title').value;
  const u = document.getElementById('url').value;
  const c = document.getElementById('cat').value;
  if(!t||!u){ alert("Remplis titre + lien"); return; }
  const yid = u.includes('v=')? u.split('v=')[1].split('&')[0] : u.split('/').pop().split('?')[0];
  await addDoc(collection(db,"videos"),{title:t, url:u, youtubeId:yid, category:c, date:Date.now()});
  document.getElementById('title').value=""; document.getElementById('url').value="";
  alert("Publié! Ça reste pour toujours dans Firebase!");
  loadVideos();
}

window.addEventListener('load', loadVideos);
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:#fff}
header{position:sticky;top:0;background:#0f0f0f;padding:12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222;z-index:10}
.logo{display:flex;align-items:center;gap:6px;font-weight:900;color:#FF0000;font-size:20px}
.search{flex:1;max-width:350px;display:flex;background:#121212;border:1px solid #333;border-radius:20px;padding:6px 12px}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.bar{padding:10px;display:flex;gap:8px;overflow-x:auto}
.bar span{background:#272727;padding:7px 12px;border-radius:8px;font-size:13px}
.publish-box{max-width:500px;margin:16px auto;background:#212121;padding:16px;border-radius:12px}
.publish-box input, .publish-box select{width:100%;padding:10px;margin:6px 0;background:#121212;border:1px solid #333;border-radius:8px;color:#fff}
.btn-pub{width:100%;padding:12px;background:#FF0000;border:none;border-radius:20px;color:#fff;font-weight:800;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 10px 80px}
.card{background:#181818;border-radius:12px;overflow:hidden}
.thumb iframe{width:100%;aspect-ratio:16/9}
.info{padding:8px}.info h3{font-size:13px}.info p{font-size:11px;color:#aaa}
</style>
</head>
<body>
<header><div class="logo">▶ FREDDY-V</div><div class="search"><input id="q" placeholder="Rechercher..." oninput="filterV()"></div></header>
<div class="bar"><span>Pour toi</span><span>Masisi</span><span>Musique</span><span>Kolwezi</span></div>

<div class="publish-box">
<h3 style="color:#FF0000">📤 Publier Vidéo (reste pour toujours)</h3>
<input id="title" placeholder="Titre de la vidéo">
<input id="url" placeholder="Lien YouTube ex: https://youtu.be/...">
<select id="cat"><option>Musique</option><option>Prédication</option><option>Science</option><option>Masisi</option></select>
<button class="btn-pub" onclick="publish()">🚀 PUBLIER</button>
<p style="font-size:11px;color:#888;margin-top:8px">Stocké dans Firebase freddy-v-kolwezi - M-Pesa +243983356734</p>
</div>

<div class="grid" id="grid"></div>

<script>
function filterV(){ let q=document.getElementById('q').value.toLowerCase(); document.querySelectorAll('.card').forEach(c=>{ c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none'; }); }
</script>
</body>
</html>
