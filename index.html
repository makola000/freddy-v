<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V - Mondial</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
header{padding:14px;text-align:center;background:#111;font-weight:bold;font-size:18px;position:sticky;top:0;z-index:10}
#videos{padding:10px;max-width:500px;margin:0 auto}
.video-card{background:#111;border-radius:16px;overflow:hidden;margin-bottom:20px;position:relative;border:1px solid #222}
.views-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.8);padding:4px 10px;border-radius:20px;font-size:12px;z-index:2}
.video-info{padding:10px}
.video-actions{display:flex;justify-content:space-around;padding:12px 5px;border-top:1px solid #222;background:#0f0f0f}
.action-btn{background:none;border:none;color:#fff;cursor:pointer;text-align:center;font-size:12px;line-height:1.2;flex:1}
.action-btn span{display:block;font-size:11px;margin-top:2px;opacity:0.8}
.action-btn.active{color:#ff3040}
iframe{width:100%;border:0;display:block}
.short-frame{height:520px!important}
.normal-frame{height:230px}
</style>
</head>
<body>
<header>🔥 FREDDY-V MONDIAL</header>
<div id="videos">Chargement...</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase, ref, onValue, runTransaction} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",
  authDomain: "freddy-v.firebaseapp.com",
  databaseURL: "https://freddy-v-default-rtdb.firebaseio.com",
  projectId: "freddy-v",
  storageBucket: "freddy-v.firebasestorage.app",
  messagingSenderId: "318263144332",
  appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const videosRef = ref(db, 'videos');

function getId(url){
  const m = (url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/))([a-zA-Z0-9_-]+)/);
  return m?m[1]:'';
}

onValue(videosRef, snap=>{
  const data = snap.val();
  const container = document.getElementById('videos');
  if(!data){ container.innerHTML='<p style="text-align:center;margin-top:50px">Aucune vidéo. Sois le premier!</p>'; return; }
  const liked = JSON.parse(localStorage.getItem('freddy_liked')||'{}');
  const saved = JSON.parse(localStorage.getItem('freddy_saved')||'{}');
  let html='';
  Object.entries(data).reverse().forEach(([key,v])=>{
    const id = getId(v.url);
    const isShort = (v.url||'').includes('shorts');
    html+=`
    <div class="video-card" data-key="${key}">
      <div class="views-badge">👁️ ${v.views||0} vues</div>
      <iframe class="${isShort?'short-frame':'normal-frame'}" src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>
      <div class="video-info"><b>${v.title||'Sans titre'}</b><br><small style="opacity:0.6">Par ${v.author||'Anonyme'} - $0.000</small></div>
      <div class="video-actions">
        <button class="action-btn ${liked[key]?'active':''}" onclick="likeVideo('${key}')"><div style="font-size:22px">❤️</div><span>${v.likes||0}</span><span>Aime</span></button>
        <button class="action-btn" onclick="shareVideo('${key}')"><div style="font-size:22px">🔗</div><span>Partager</span></button>
        <button class="action-btn" onclick="downloadVideo('${v.url}')"><div style="font-size:22px">⬇️</div><span>Télécharger</span></button>
        <button class="action-btn ${saved[key]?'active':''}" onclick="saveVideo('${key}')"><div style="font-size:22px">${saved[key]?'🔖':'📑'}</div><span>${saved[key]?'Enregistré':'Enregistrer'}</span></button>
      </div>
    </div>`;
  });
  container.innerHTML=html;
});

window.likeVideo = (key)=>{
  const liked = JSON.parse(localStorage.getItem('freddy_liked')||'{}');
  const r = ref(db, `videos/${key}/likes`);
  if(liked[key]){ delete liked[key]; runTransaction(r, c=>(c||1)-1); }
  else { liked[key]=true; runTransaction(r, c=>(c||0)+1); }
  localStorage.setItem('freddy_liked', JSON.stringify(liked));
};
window.saveVideo = (key)=>{
  const saved = JSON.parse(localStorage.getItem('freddy_saved')||'{}');
  if(saved[key]){ delete saved[key]; alert('❌ Retiré des enregistrés'); }
  else { saved[key]=true; alert('✅ Vidéo enregistrée!'); }
  localStorage.setItem('freddy_saved', JSON.stringify(saved));
};
window.shareVideo = (key)=>{
  const link = `https://makola000.github.io/freddy-v/?v=${key}`;
  if(navigator.share){ navigator.share({title:'FREDDY-V', url:link}); }
  else { navigator.clipboard.writeText(link); alert('Lien copié: '+link); }
};
window.downloadVideo = (url)=>{
  const id = getId(url);
  const dlLink = `https://www.youtube.com/watch?v=${id}`;
  navigator.clipboard.writeText(dlLink);
  alert('Lien YouTube copié! YouTube bloque le téléchargement direct.');
  window.open(dlLink,'_blank');
};
document.addEventListener('click', e=>{
  const card = e.target.closest('.video-card');
  if(card){ runTransaction(ref(db, `videos/${card.dataset.key}/views`), c=>(c||0)+1); }
});
</script>
</body>
</html>
