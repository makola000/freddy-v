<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>FREDDY-V</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:10px}.header{display:flex;justify-content:space-between}.btn{padding:8px 14px;border-radius:20px;border:0;font-weight:bold}.btn-red{background:#e50914;color:#fff}.btn-white{background:#fff;color:#000}.card{background:#111;border-radius:10px;padding:10px;margin:15px 0}.thumb{width:100%;border-radius:8px}</style></head><body>
<div class="header"><b>FREDDY-V</b><div><button class="btn btn-red" onclick="location.href='publier.html'">+ PUBLIER</button> <button class="btn btn-white" onclick="location.href='ma-chaine.html'">MOI</button></div></div>
<div id="videos">Chargement...</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase.js";
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
async function load(){
 const c=document.getElementById('videos');
 try{
  const snap=await getDocs(collection(db,"videos"));
  if(snap.empty){c.innerHTML="Aucune video";return;}
  let h="";
  snap.forEach(d=>{
   const v=d.data()||{};
   const thumb=v.youtubeId?`https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg`:"";
   h+=`<div class="card"><img class="thumb" src="${thumb}"><h3>${v.titre||'Video'}</h3><p>${v.vues||0} vues</p><button class="btn btn-red" onclick="regarder('${d.id}','${v.userId||''}')">REGARDER</button></div>`;
  });
  c.innerHTML=h;
 }catch(e){c.innerHTML="Erreur: "+e.message;}
}
window.regarder=async(id,prop)=>{
 await updateDoc(doc(db,"videos",id),{vues:increment(1)});
 alert("Vue comptee!");location.reload();
};
load();
</script>
</body></html>
