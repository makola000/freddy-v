<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREDDY-V</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#111;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:red;font-weight:bold;font-size:20px}.btn{background:red;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#111;border-radius:12px;overflow:hidden;position:relative}
.card img{width:100%;aspect-ratio:9/16;object-fit:cover;background:#222;display:block}
.info{padding:6px;font-size:11px;position:absolute;bottom:0;background:linear-gradient(transparent,black);width:100%;box-sizing:border-box}
#player{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;z-index:100;justify-content:center;align-items:center;flex-direction:column}
#player iframe,#player video{width:100%;max-width:400px;aspect-ratio:9/16;background:#000;border:0}
#close{position:absolute;top:15px;right:15px;background:red;color:#fff;border:0;padding:10px 15px;border-radius:50%;font-weight:bold}
</style></head><body>
<div class="header"><div class="logo">FREDDY-V</div><a class="btn" href="ma-chaine.html">Ma Chaîne</a></div>
<div id="list" class="grid"><p style="grid-column:1/3;text-align:center;padding:40px">⏳ Chargement...</p></div>
<div id="player"><button id="close" onclick="closeP()">✕</button><div id="pContent" style="width:100%;display:flex;justify-content:center"></div></div>
<script>
const cfg={apiKey:"AIzaSyCZTfMR94q2t4W1c0N7LK5YpN14M8iBVvA",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v"};
firebase.initializeApp(cfg); const db=firebase.firestore();
function closeP(){document.getElementById('player').style.display='none';document.getElementById('pContent').innerHTML='';}
function playYT(id){document.getElementById('pContent').innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allowfullscreen></iframe>`;document.getElementById('player').style.display='flex';}
function playFile(url){document.getElementById('pContent').innerHTML=`<video src="${url}" controls autoplay playsinline></video>`;document.getElementById('player').style.display='flex';}
async function load(){
 try{
  let snap=await db.collection('videos').orderBy('created','desc').limit(100).get().catch(async()=>{return await db.collection('videos').limit(100).get();});
  const list=document.getElementById('list'); list.innerHTML='';
  snap.forEach(d=>{
   const v=d.data(); const id=v.youtubeId||''; const url=v.videoUrl||'';
   const thumb=id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:(url?'':`https://via.placeholder.com/320x500/111/fff?text=FREDDY-V`);
   const click=id?`playYT('${id}')`:`playFile('${url}')`;
   const media=id?`<img src="${thumb}">`:(url?`<video src="${url}" muted></video>`:`<img src="${thumb}">`);
   list.innerHTML+=`<div class="card" onclick="${click}">${media}<div class="info"><b>${(v.title||'Vidéo').substring(0,30)}</b><br>${v.ownerName||''} • ${v.views||0} vues</div></div>`;
  });
 }catch(e){document.getElementById('list').innerHTML='Erreur: '+e.message}
}
load();
</script></body></html>
