<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREDDY-V</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:100}
.header b{font-size:18px}
.header a{color:#fff;text-decoration:none;margin-left:10px;font-size:14px}
.btn-pub{background:red;padding:7px 14px;border-radius:20px;font-weight:bold}
.video-card{padding:12px;border-bottom:1px solid #222}
.thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#111;border-radius:12px;overflow:hidden;cursor:pointer}
.thumb-wrap img{width:100%;height:100%;object-fit:cover}
.thumb-wrap iframe{width:100%;height:100%;border:0}
.info{padding:10px 0}
.info b{font-size:15px}
.info small{color:#aaa}
.actions{display:flex;gap:18px;margin-top:8px;color:#aaa;font-size:14px;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;width:100%;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0}
.bottom div{text-align:center;font-size:12px;color:#aaa}
.bottom div.active{color:#fff}
#playerBox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;overflow:auto}
</style>
</head>
<body>

<div class="header">
 <div><b>FREDDY-V</b> <span style="margin-left:15px;color:#aaa;font-size:14px">Shorts</span></div>
 <div><a href="upload.html" class="btn-pub">+ PUBLIER</a> <span style="margin-left:10px">MOI</span></div>
</div>

<div id="playerBox">
 <div style="padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222"><b id="pTitreHead">FREDDY-V</b><b onclick="closePlayer()" style="background:red;padding:8px 14px;border-radius:20px;cursor:pointer">✕ Fermer</b></div>
 <div id="playerContent"></div>
 <div style="padding:12px"><b id="pTitre"></b><br><small id="pAuteur" style="color:#aaa"></small><div style="margin-top:12px;display:flex;gap:18px;color:#aaa"><span>❤️ Aime</span><span>🔗 Partager</span><span>⬇️ Télécharger</span><span>💾 Enregistrer</span></div></div>
</div>

<div id="videos" style="padding-bottom:70px">
 <div style="padding:20px;text-align:center;color:#aaa">Chargement...</div>
</div>

<div class="bottom">
 <div class="active" onclick="location.href='index.html'">🏠<br>Accueil</div>
 <div>▶️<br>Shorts</div>
 <div onclick="location.href='upload.html'">➕<br> </div>
 <div>👤<br>Moi</div>
</div>

<script>
const cfg={apiKey:"AIzaSyCZTfMR94q2t4W1c0N7LK5YpN14M8iBVvA",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.firestore();

function playInFreddyV(id,type,titre,auteur){
 document.getElementById('playerBox').style.display='block';
 document.getElementById('pTitreHead').innerText=titre;
 document.getElementById('pTitre').innerText=titre;
 document.getElementById('pAuteur').innerText=auteur+' • 0 vues • $0.000 (80%)';
 let c=document.getElementById('playerContent');
 if(type==='photo'){
   c.innerHTML='<img src="'+id+'" style="width:100%;max-height:60vh;object-fit:contain;background:#111">';
 } else {
   c.innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1" style="width:100%;height:52vh;border:0" allowfullscreen allow="autoplay; encrypted-media"></iframe>';
 }
 window.scrollTo(0,0);
}
function closePlayer(){
 document.getElementById('playerBox').style.display='none';
 document.getElementById('playerContent').innerHTML='';
}

db.collection("videos").orderBy("timestamp","desc").onSnapshot(snap=>{
 let html='';
 snap.forEach(doc=>{
  let v=doc.data();
  let id=v.youtubeId||'';
  let type=v.type||'video';
  let titre=(v.titre||'Sans titre').replace(/'/g,"\\'");
  let auteur=(v.auteur||'Anonyme').replace(/'/g,"\\'");
  let thumb='';
  if(type==='photo'){
    thumb='<img src="'+id+'" onerror="this.src=\'https://via.placeholder.com/320x180/111/fff?text=FREDDY-V\'">';
  } else {
    thumb='<img src="https://img.youtube.com/vi/'+id+'/hqdefault.jpg" onerror="this.src=\'https://via.placeholder.com/320x180/111/fff?text=FREDDY-V\'"><div style="position:absolute;bottom:8px;right:8px;background:#000a;padding:3px 6px;border-radius:4px;font-size:12px">▶️</div>';
  }
  html+=`
  <div class="video-card">
   <div class="thumb-wrap" onclick="playInFreddyV('${id}','${type}','${titre}','${auteur}')">
    ${thumb}
   </div>
   <div class="info">
    <b>${v.titre||'Sans titre'}</b><br>
    <small>${v.auteur||'Anonyme'} - 0 vues - $0.000 (80%)</small>
    <div class="actions">
     <span>❤️ Aime</span><span>🔗 Partager</span><span>⬇️ Télécharger</span><span>💾 Enregistrer</span>
    </div>
   </div>
  </div>`;
 });
 document.getElementById('videos').innerHTML=html||'<div style="padding:20px;text-align:center">Aucune vidéo. <a href="upload.html" style="color:red">Publie la première!</a></div>';
});
</script>
</body>
</html>
