<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V Mondial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#0f0f0f;color:white;margin:0;padding:0}
header{background:#ff0000;padding:20px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#1e1e1e;padding:15px;border-radius:12px;margin-bottom:15px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}
button{background:#ff0000;color:white;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}
button:hover{background:#cc0000}
.video-card{background:#1e1e1e;padding:12px;border-radius:12px;margin-bottom:20px}
.video-card iframe{width:100%;height:220px;border-radius:10px;border:none}
.video-card h3{margin:10px 0 5px}
.video-card p{color:#aaa;margin:0 0 10px}
.delete-btn{background:#333;margin-top:10px}
.delete-btn:hover{background:#ff0000}
</style>
</head>
<body>

<header>
<h1>🔥 FREDDY-V Mondial 🔥</h1>
<p>Publiez, Regardez, Partagez pour tout le monde</p>
</header>

<div class="container">

<div class="card">
<h2>📤 Publier une vidéo</h2>
<input id="titre" placeholder="Titre de la vidéo : Ex: L'église se prépare">
<input id="chaine" placeholder="Nom de ta chaîne : Ex: freddyvmondial">
<input id="youtube_url" placeholder="Lien YouTube : Ex: https://youtube.com/watch?v=...">
<button onclick="publier()">PUBLIER MAINTENANT</button>
<p id="msg" style="text-align:center"></p>
</div>

<h2>🔥 Vidéos populaires</h2>
<div id="liste">Chargement...</div>

</div>

<script>
const SUPABASE_URL = "https://ugffxavzyxczchxmfscq.supabase.co";
const SUPABASE_KEY = "sb_publishable_DgJKD1dhv8EsU5qmZ-6D3Q_67CtnLh6";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function youtubeToEmbed(url){
  let id = "";
  if(url.includes("youtu.be/")) id = url.split("youtu.be/")[1].split("?")[0];
  else if(url.includes("v=")) id = url.split("v=")[1].split("&")[0];
  else if(url.includes("shorts/")) id = url.split("shorts/")[1].split("?")[0];
  else if(url.includes("embed/")) id = url.split("embed/")[1].split("?")[0];
  return {id: id, embed: "https://www.youtube.com/embed/" + id};
}

async function publier(){
  let titre = document.getElementById("titre").value;
  let chaine = document.getElementById("chaine").value;
  let youtube_url = document.getElementById("youtube_url").value;
  if(!titre || !youtube_url){ alert("Mets le titre et le lien YouTube !"); return; }
  let conv = youtubeToEmbed(youtube_url);
  document.getElementById("msg").innerText = "Publication en cours...";
  let { error } = await supabaseClient.from("videos").insert([{
    title: titre,
    channel: chaine || "FREDDY-V",
    youtube_url: youtube_url,
    video_url: youtube_url,
    embed_url: conv.embed,
    link: youtube_url
  }]);
  if(error){ alert("Erreur : " + error.message); document.getElementById("msg").innerText=""; }
  else{
    alert("Vidéo publiée ! 🎉");
    document.getElementById("titre").value="";
    document.getElementById("youtube_url").value="";
    document.getElementById("msg").innerText="";
    charger();
  }
}

async function supprimerVideo(id){
  let code = prompt("Code patron ?");
  if(code !== "FREDDY123"){
    alert("Tu n'es pas le patron !");
    return;
  }
  if(!confirm("Tu veux vraiment supprimer cette vidéo ?")) return;
  let { error } = await supabaseClient.from("videos").delete().eq("id", id);
  if(error) alert("Erreur : " + error.message);
  else { alert("Vidéo supprimée !"); charger(); }
}

async function charger(){
  let { data, error } = await supabaseClient.from("videos").select("*").order("created_at", {ascending:false});
  if(error){ document.getElementById("liste").innerHTML = "Erreur : " + error.message; return; }
  if(!data || data.length===0){ document.getElementById("liste").innerHTML="Pas encore de vidéo. Sois le premier !"; return; }
  let html = "";
  data.forEach(v=>{
    let embed = v.embed_url || v.video_url || v.youtube_url || v.link;
    html += `<div class="video-card">
      <iframe src="${embed}" allowfullscreen></iframe>
      <h3>${v.title || "Sans titre"}</h3>
      <p>${v.channel || "FREDDY-V"}</p>
      <button class="delete-btn" onclick="supprimerVideo('${v.id}')">🗑️ Supprimer (Patron seulement)</button>
    </div>`;
  });
  document.getElementById("liste").innerHTML = html;
}
charger();
</script>
</body>
</html>
