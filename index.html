<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

<header class="flex justify-between p-3 border-b sticky top-0 bg-white">
<h1 class="font-bold">FREDDY-V <span class="bg-red-600 text-white px-1 rounded">TV</span></h1>
<a href="publier.html" class="bg-red-600 text-white px-4 py-1 rounded-full text-sm">+ Publier</a>
</header>

<div id="videos" class="p-3">Chargement... ⏳</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

async function start(){
 try{
  const t = await (await fetch('./publier.html')).text();
  const m = t.match(/const firebaseConfig = \{([\s\S]*?)\};/);
  const cfg = Function('"use strict";return {'+m[1]+'}')();
  
  const app = initializeApp(cfg);
  const db = getFirestore(app);
  const snap = await getDocs(query(collection(db,"videos"), orderBy("timestamp","desc")));
  const c = document.getElementById('videos');
  if(snap.empty){ c.innerHTML='Aucune vidéo. <a href="publier.html" class="text-red-600">Publie</a>'; return; }
  let h='';
  snap.forEach(doc=>{
   const v=doc.data();
   h+=`<div class="flex gap-3 border-b pb-3 mb-3"><div class="w-36 h-20 bg-black rounded-lg flex items-center justify-center text-white">▶️</div><div><b class="text-sm">${v.titre}</b><p class="text-xs text-gray-500">${v.auteur||'Freddy'} • ${v.type}</p><a href="${v.url}" target="_blank" class="text-xs bg-red-600 text-white px-3 py-1 rounded-full mt-1 inline-block">▶️ Voir</a></div></div>`;
  });
  c.innerHTML=h;
 }catch(e){ document.getElementById('videos').innerHTML='<p class="text-red-600 text-center">Erreur: '+e.message+'</p>'; }
}
start();
</script>
</body>
</html>
