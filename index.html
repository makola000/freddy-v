<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
body{background:#f5f5f5}
.card{transition:0.2s}
.card:active{transform:scale(0.98)}
</style>
</head>
<body class="pb-20">

<!-- HEADER - DESIGN ORIGINAL -->
<header class="bg-white sticky top-0 z-40 border-b px-3 py-2.5 flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="bg-red-600 text-white font-black px-3 py-1 rounded-md text-sm">FREDDY</span>
<span class="font-black text-sm">-V</span>
</div>
<div class="flex items-center gap-3">
<a href="publier.html" class="bg-black text-white px-4 py-1.5 rounded-full text-sm font-bold"><i class="fa fa-plus mr-1"></i> Publier</a>
</div>
</header>

<!-- PLAYER - CORRIGÉ -->
<div id="player" class="hidden bg-black sticky top-[49px] z-50">
<div id="playerBox" class="w-full"></div>
<button onclick="closePlayer()" class="w-full bg-zinc-800 text-white text-xs py-3"><i class="fa fa-times mr-2"></i>Fermer la vidéo</button>
</div>

<!-- SHORTS -->
<div class="bg-white mt-2 p-3">
<div class="flex justify-between items-center mb-3">
<h2 class="font-black text-sm flex items-center gap-2"><span class="bg-red-600 text-white px-1.5 py-0.5 rounded text-xs">▶</span> Shorts</h2>
</div>
<div id="shorts" class="grid grid-cols-2 gap-3">
<p class="text-xs text-gray-400">Chargement...</p>
</div>
</div>

<!-- VIDEOS -->
<div class="bg-white mt-2">
<div class="p-3 border-b">
<h2 class="font-black text-sm">Vidéos</h2>
</div>
<div id="videos">
<p class="text-xs text-gray-400 p-3">Chargement...</p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM", authDomain: "freddy-v.firebaseapp.com", projectId: "freddy-v", storageBucket: "freddy-v.firebasestorage.app", messagingSenderId: "318263144332", appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== FIX IMPORTANT POUR ?si= =====
function getId(url){
  if(!url) return "";
  let id="";
  if(url.includes("youtu.be/")) id=url.split("youtu.be/")[1].split("?")[0].split("&")[0];
  else if(url.includes("watch?v=")) id=url.split("watch?v=")[1].split("&")[0].split("?")[0];
  else if(url.includes("shorts/")) id=url.split("shorts/")[1].split("?")[0].split("&")[0];
  else if(url.includes("embed/")) id=url.split("embed/")[1].split("?")[0];
  return id.substring(0,11);
}
function toEmbed(url){
  const id = getId(url);
  if(!id) return url;
  return "https://www.youtube.com/embed/" + id;
}

window.closePlayer = function(){
  document.getElementById('player').classList.add('hidden');
  document.getElementById('playerBox').innerHTML='';
}

window.playVideo = async function(docId, url){
  const vidId = getId(url);
  if(!vidId){ alert("Lien invalide: "+url); return; }
  const embed = toEmbed(url);
  document.getElementById('playerBox').innerHTML = `<iframe src="${embed}?autoplay=1&rel=0&modestbranding=1" class="w-full h-[300px]" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  document.getElementById('player').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
  try{ await updateDoc(doc(db,"videos",docId),{vues:increment(1)}); }catch(e){}
}

async function load(){
  const shortsDiv = document.getElementById('shorts');
  const videosDiv = document.getElementById('videos');
  try{
    const snap = await getDocs(collection(db,"videos"));
    if(snap.empty){
      shortsDiv.innerHTML="<p class='text-xs text-gray-400'>Aucune vidéo. Publie une!</p>";
      videosDiv.innerHTML="";
      return;
    }
    let htmlShorts=""; let htmlVideos="";
    snap.forEach(d=>{
      const v = d.data();
      const vidId = getId(v.url);
      if(!vidId) return;
      const thumb = `https://img.youtube.com/vi/${vidId}/mqdefault.jpg`;
      const titre = v.titre || "Sans titre";
      const vues = v.vues || 0;
      const auteur = v.auteur || "Makola Freddy";
      
      if(v.type==="short"){
        htmlShorts+=`<div onclick="playVideo('${d.id}','${v.url}')" class="card cursor-pointer"><div class="w-full h-[220px] bg-black rounded-xl overflow-hidden"><img src="${thumb}" class="w-full h-full object-cover"></div><p class="font-bold text-[13px] mt-2 line-clamp-2 leading-tight">${titre}</p><p class="text-[11px] text-gray-500 mt-1">${vues} vues • ${auteur}</p></div>`;
      } else {
        htmlVideos+=`<div onclick="playVideo('${d.id}','${v.url}')" class="card cursor-pointer border-b border-gray-100"><div class="w-full aspect-video bg-black overflow-hidden"><img src="${thumb}" class="w-full h-full object-cover"></div><div class="p-3"><h3 class="font-bold text-sm leading-tight">${titre}</h3><p class="text-xs text-gray-500 mt-1">${auteur} • ${vues} vues</p></div></div>`;
      }
    });
    shortsDiv.innerHTML = htmlShorts || "<p class='text-xs text-gray-400'>Pas de Shorts</p>";
    videosDiv.innerHTML = htmlVideos || "<p class='text-xs text-gray-400 p-3'>Pas de vidéos normales</p>";
  }catch(e){
    shortsDiv.innerHTML = "<p class='text-xs text-red-500'>Erreur: "+e.message+"</p>";
  }
}
load();
</script>
</body>
</html>
