<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY V - MAKOLA IA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",
  authDomain: "freddy-v.firebaseapp.com",
  projectId: "freddy-v",
  storageBucket: "freddy-v.firebasestorage.app",
  messagingSenderId: "318263144332",
  appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const produitsRef = collection(db, "produits");
onSnapshot(produitsRef, (snap) => {
  const list = document.getElementById('produits-list');
  const count = document.getElementById('produit-count');
  list.innerHTML = "";
  let items = [];
  snap.forEach(d => items.push({id:d.id, ...d.data()}));
  count.textContent = items.length + " produits sauvegardés";
  if(items.length === 0){
    list.innerHTML = `<p class='text-center text-gray-400 py-10'>Aucun produit. Ajoute en bas!</p>`;
    return;
  }
  items.forEach(p => {
    list.innerHTML += `<div class="bg-white rounded-2xl shadow p-4 flex justify-between items-center"><div><b>${p.nom}</b><br><span class="text-blue-600 font-black">${p.prix} $</span> - ${p.categorie}</div><button onclick="supprimer('${p.id}')" class="bg-red-100 text-red-600 px-3 py-1 rounded-full"><i class="fas fa-trash"></i></button></div>`;
  });
});
window.ajouterProduit = async () => {
  const nom = document.getElementById('nom').value;
  const prix = document.getElementById('prix').value;
  const cat = document.getElementById('cat').value;
  if(!nom || !prix) return alert("Remplis nom et prix!");
  await addDoc(produitsRef, { nom, prix, categorie: cat, date: new Date() });
  document.getElementById('nom').value=""; document.getElementById('prix').value=""; document.getElementById('cat').value="";
  alert("✅ Produit ajouté! Il restera pour toujours!");
}
window.supprimer = async (id) => { if(confirm("Supprimer?")) await deleteDoc(doc(db, "produits", id)); }
</script>
</head>
<body class="bg-gray-100 min-h-screen">
<header class="bg-black text-white p-4"><div class="flex justify-between items-center max-w-5xl mx-auto"><h1 class="font-black text-xl">⚡ FREDDY V</h1><span class="bg-green-500 text-xs px-3 py-1 rounded-full">● CONNECTÉ À FIREBASE</span></div></header>
<main class="max-w-5xl mx-auto p-4">
<div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white rounded-3xl p-6 mb-6"><h2 class="text-2xl font-black">MAKOLA IA</h2><p>Durba • Système en ligne - Les données ne s'effacent plus!</p><p id="produit-count" class="mt-3 bg-white/20 inline-block px-3 py-1 rounded-full text-sm">Chargement...</p></div>
<div class="bg-white rounded-2xl p-5 shadow mb-6"><h3 class="font-bold mb-3">+ Ajouter Produit</h3><div class="flex flex-col gap-3"><input id="nom" placeholder="Nom du produit (ex: Or Durba)" class="border rounded-xl p-3"><input id="prix" type="number" placeholder="Prix en $" class="border rounded-xl p-3"><input id="cat" placeholder="Catégorie (Or, Diamant...)" class="border rounded-xl p-3"><button onclick="ajouterProduit()" class="bg-black text-white rounded-xl p-3 font-bold">AJOUTER LE PRODUIT</button></div></div>
<h3 class="font-bold mb-3">📦 Boutique en ligne</h3><div id="produits-list" class="grid gap-3"><p class="text-center text-gray-400">Chargement...</p></div>
</main>
</body>
</html>
