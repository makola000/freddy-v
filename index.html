<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-white">
<header class="flex justify-between items-center px-3 py-3 border-b sticky top-0 bg-white z-50">
<a href="index.html" class="bg-red-600 text-white font-black px-3 py-1 rounded">FREDDY-V</a>
<div class="flex items-center gap-3">
<a href="publier.html" class="bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center"><i class="fa fa-plus"></i></a>
<a href="notifications.html"><i class="fa fa-bell text-xl"></i></a>
<a href="ma-chaine.html" class="w-8 h-8 bg-black rounded-full flex items-center justify-center text-white text-xs">M</a>
</div>
</header>

<div id="player" class="hidden bg-black">
<div id="playerBox" class="w-full aspect-video bg-black"></div>
<div class="p-3 bg-white"><h2 id="playerTitre" class="font-bold text-sm"></h2><p id="playerAuteur" class="text-xs text-gray-500"></p><button id="btnAbonner" onclick="abonner()" class="mt-2 bg-black text-white text-xs px-4 py-1.5 rounded-full">S'abonner</button><p id="playerVues" class="text-xs text-gray-500 mt-2"></p></div>
</div>

<div id="status" class="text-center py-10 text-sm text-gray-500">Chargement...</div>
<div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-3 p-3"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM", authDomain: "freddy-v.firebaseapp.com", projectId: "freddy-v", storageBucket: "freddy-v.firebasestorage.app", messagingSenderId: "318263144332", appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9" };
const db = getFirestore(initializeApp(firebaseConfig));
let videos=[]; let currentHandle=null; let currentId=null;

async function load(){
 try{
  const snap = await getDocs(collection(db,"videos"));
  videos=[]; snap.forEach(d=>videos.push({id:d.id, ...d.data()}));
  const status=document.getElementById('status');
  const grid=document.getElementById('grid');
  if(videos.length===0){ status.innerHTML="Aucune vidéo pour le moment.<br><a href='publier.html' class='text-red-600 font-bold'>Publie la première!</a>"; return; }
  status.style.display="none";
  let h=""; videos.reverse().forEach(v=>{
    const t=(v.titre||"Sans titre").replace(/'/g," ");
    const a=(v.auteur||"Inconnu").replace(/'/g," ");
    h+=`<div onclick="play('${v.url}','${t}','${a}','${v.id}','${v.chaineHandle||''}')" class="cursor-pointer"><div class="w-full aspect-video bg-black rounded-xl overflow-hidden"><video src="${v.url}" class="w-full h-full object-cover" muted></video></div><p class="font-bold text-xs mt-1">${v.titre}</p><p class="text-[11px] text-gray-500">${v.auteur} • ${v.vues||0} vues</p></div>`;
  }); grid.innerHTML=h;
 }catch(e){ document.getElementById('status').innerText="Erreur: "+e.message+" - Va dans Firebase Console > Firestore > créer collection videos"; console.log(e); }
}
window.play=async function(url,titre,auteur,id,handle){
 currentHandle=handle; currentId=id;
 document.getElementById('playerBox').innerHTML=`<video id="mainVideo" src="${url}" controls autoplay class="w-full h-full"></video>`;
 document.getElementById('playerTitre').innerText=titre;
 document.getElementById('playerAuteur').innerText=auteur;
 document.getElementById('playerVues').innerText="En lecture - vue comptée après 30s";
 document.getElementById('player').classList.remove('hidden');
 window.scrollTo({top:0,behavior:'smooth'});
 let counted=false;
 const videoEl=document.getElementById('mainVideo');
 videoEl.addEventListener('timeupdate', async ()=>{
  if(videoEl.currentTime>=30 && !counted){
   counted=true;
   try{
    const {doc,updateDoc,increment} = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
    await updateDoc(doc(db,"videos",id),{vues: increment(1)});
    document.getElementById('playerVues').innerText="✅ Vue comptée +1";
   }catch(e){ console.log(e); }
  }
 });
}
window.abonner=async()=>{
 if(!currentHandle){ alert("Pas de chaîne"); return; }
 const email=localStorage.getItem("freddy_user"); if(!email){ location.href="connexion.html"; return; }
 const {addDoc} = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
 await addDoc(collection(db,"abonnements"),{userEmail:email, chaineHandle:currentHandle, date:new Date().toISOString()});
 document.getElementById('btnAbonner').innerText="✅ Abonné";
}
load();
</script>
</body>
</html>
