<!-- 🔥 COMPTEUR VUES TEMPS RÉEL -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",
  authDomain: "freddy-v.firebaseapp.com",
  projectId: "freddy-v",
  storageBucket: "freddy-v.firebasestorage.app",
  messagingSenderId: "318263144332",
  appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function getVues(nom){
  try{
    const ref = doc(db, "vues", nom);
    const snap = await getDoc(ref);
    if(snap.exists()) return snap.data().vues;
    return null;
  }catch(e){ return null; }
}

async function addVue(nom){
  try{
    const ref = doc(db, "vues", nom);
    const snap = await getDoc(ref);
    if(!snap.exists()){
      await setDoc(ref, { vues: 1, nom: nom });
      return 1;
    } else {
      await updateDoc(ref, { vues: increment(1) });
      const newSnap = await getDoc(ref);
      return newSnap.data().vues;
    }
  }catch(e){
    // Si Firebase bloque, utilise localStorage
    let local = parseInt(localStorage.getItem(nom) || "0") + 1;
    localStorage.setItem(nom, local);
    return local;
  }
}

// Affiche les vues au chargement
(async()=>{
  let v1 = await getVues("demo-short");
  if(v1) document.getElementById('vues-demo').innerText = v1 >= 1000 ? (v1/1000).toFixed(1)+'K vues' : v1+' vues';
  else {
    let local = localStorage.getItem("demo-short");
    if(local) document.getElementById('vues-demo').innerText = local+' vues';
  }
  
  let v2 = await getVues("short-2");
  if(v2) document.getElementById('vues-short2').innerText = v2+' vues';
  
  let v3 = await getVues("video-principale");
  if(v3) document.getElementById('vues-principale').innerText = v3+' vues';
  else {
    let local = localStorage.getItem("video-principale");
    if(local) document.getElementById('vues-principale').innerText = local+' vues';
  }
})();

// Clic DEMO SHORT
document.getElementById('card-demo').onclick = async ()=>{
  let vues = await addVue("demo-short");
  document.getElementById('vues-demo').innerText = vues >= 1000 ? (vues/1000).toFixed(1)+'K vues' : vues+' vues';
};

// Clic SHORT 2
document.getElementById('card-short2').onclick = async ()=>{
  let vues = await addVue("short-2");
  document.getElementById('vues-short2').innerText = vues+' vues';
};

// Clic VIDÉO PRINCIPALE
document.getElementById('card-video').onclick = async ()=>{
  let vues = await addVue("video-principale");
  document.getElementById('vues-principale').innerText = vues+' vues';
};
</script>

</body>
