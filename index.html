<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V - Vidéos du Congo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment, getDoc, setDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

const firebaseConfig = {apiKey:"AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v",storageBucket:"freddy-v.firebasestorage.app",messagingSenderId:"318263144332",appId:"1:318263144332:web:387b2ded7cf5b85d6eb0a9"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);

async function chargerVideos(){
 const cont=document.getElementById('videos');
 cont.innerHTML="Chargement...";
 try{
  const q=query(collection(db,"videos"));
  const snap=await getDocs(q);
  if(snap.empty){cont.innerHTML=`<div class='bg-white text-black p-6 rounded-xl text-center'>Aucune vidéo encore.<br>Sois le premier à <a href='publier.html' class='text-red-600 font-bold'>publier!</a></div>`;return;}
  let html="";
  snap.forEach(d=>{
   const v=d.data(); const id=d.id;
   let embed="";
   if(v.lien.includes("youtube")||v.lien.includes("youtu.be")){
     let vid=v.lien.split("v=")[1]; if(!vid) vid=v.lien.split("/").pop(); if(vid) vid=vid.split("&")[0];
     embed=`<iframe src="https://www.youtube.com/embed/${vid}" class="w-full h-48 rounded-xl" allowfullscreen></iframe>`;
   } else { embed=`<video src="${v.lien}" controls class="w-full h-48 rounded-xl bg-black"></video>`;}
   html+=`<div class="bg-white text-black p-3 rounded-2xl mb-4">
   ${embed}
   <h3 class="font-black mt-2">${v.titre}</h3>
   <p class="text-xs text-gray-500">Par ${v.ownerNom} - ${v.vues||0} vues</p>
   <button onclick="voir('${id}','${v.ownerTel}')" class="mt-2 w-full bg-black text-white p-2 rounded-xl text-sm font-bold">REGARDER (+0.01$)</button>
   </div>`;
  });
  cont.innerHTML=html;
 }catch(e){cont.innerHTML=`Erreur: ${e.message}`;}
}

window.voir=async(id, ownerTel)=>{
 try{
  const videoRef=doc(db,"videos",id);
  await updateDoc(videoRef,{vues: increment(1), revenusOwner: increment(0.008), revenusFreddy: increment(0.002)});
  const revRef=doc(db,"revenus",ownerTel);
  const revSnap=await getDoc(revRef);
  if(revSnap.exists()){await updateDoc(revRef,{vuesTotales: increment(1), monArgent: increment(0.008), partFreddyV: increment(0.002)});}
  else{await setDoc(revRef,{vuesTotales:1, monArgent:0.008, partFreddyV:0.002});}
  const myTel=localStorage.getItem('freddy_tel');
  if(myTel){
   const myRev=doc(db,"revenus",myTel);
   const s=await getDoc(myRev);
   if(!s.exists()) await setDoc(myRev,{vuesTotales:0,monArgent:0,partFreddyV:0});
  }
  // Gains pour TOI Makola (admin)
  const adminRef=doc(db,"revenus","ADMIN_MAKOLA");
  const a=await getDoc(adminRef);
  if(a.exists()) await updateDoc(adminRef,{partFreddyV: increment(0.002), vuesTotales: increment(1)});
  else await setDoc(adminRef,{vuesTotales:1, monArgent:0, partFreddyV:0.002, nom:"Makola Admin"});

  alert("Vue comptée! +0.008$ pour le créateur, +0.002$ pour toi Makola! Regarde tes revenus.");
  chargerVideos();
 }catch(e){alert("Erreur vue: "+e.message);}
}

window.onload=chargerVideos;
</script>
</head>

</header>
<p class="text-gray-400 text-sm mb-4">YouTube du Congo - Gagne 80% par vue</p>
<div id="videos"></div>
<div class="mt-8 text-center text-xs text-gray-500">

<br><br>Ton site officiel: https://makola0.github.io/freddy-v/
</div>
</div>
</body>
