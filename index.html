<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY V - MAKOLA IA | Durba</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",
  authDomain: "freddy-v.firebaseapp.com",
  projectId: "freddy-v",
  storageBucket: "freddy-v.firebasestorage.app",
  messagingSenderId: "318263144332",
  appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// CHARGER PRODUITS EN TEMPS REEL
const produitsRef = collection(db, "produits");
onSnapshot(produitsRef, (snap) => {
  const list = document.getElementById('produits-list');
  const count = document.getElementById('produit-count');
  list.innerHTML = "";
  let items = [];
  snap.forEach(d => items.push({id:d.id, ...d.data()}));
  count.textContent = items.length + " produits";
  if(items.length === 0){
    list.innerHTML = `<div class="col-span-2 text-center py-10 text-gray-500"><i class="fas fa-box-open text-4xl mb-3"></i><p>Aucun produit. Ajoute ton premier!</p></div>`;
    return;
  }
  items.forEach(p => {
    list.innerHTML += `
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
      <div class="h-32 bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-3xl">
        <i class="fas fa-${p.icone||'shopping-bag'}"></i>
      </div>
      <div class="p-4">
        <h3 class="font-bold text-lg">${p.nom}</h3>
        <p class="text-sm text-gray-500">${p.categorie||'Général'}</p>
        <div class="flex justify-between items-center mt-3">
          <span class="font-black text-blue-600 text-xl">${p.prix} $</span>
          <button onclick="supprimer('${p.id}')" class="text-red-500"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    </div>`;
  });
});

// AJOUTER PRODUIT
window.ajouterProduit = async () => {
  const nom = document.getElementById('nom').value;
  const prix = document.getElementById('prix').value;
  const cat = document.getElementById('cat').value;
  if(!nom || !prix) return alert("Remplis nom et prix!");
  await addDoc(produitsRef, { nom, prix, categorie: cat, icone: "shopping-bag", date: new Date() });
  document.getElementById('nom').value=""; document.getElementById('prix').value="";
  alert("✅ Produit ajouté! Visible sur tous les téléphones!");
}

window.supprimer = async (id) => {
  if(confirm("Supprimer ce produit?")) await deleteDoc(doc(db, "produits", id));
}
</script>
</head>

<header class="bg-black text-white p-4 sticky top-0 z-10">
  <div class="flex justify-between items-center max-w-5xl mx-auto">
    <h1 class="font-black text-xl"><i class="fas fa-bolt text-yellow-400"></i> FREDDY V</h1>
    <span class="bg-green-500 text-xs px-3 py-1 rounded-full animate-pulse">● CONNECTÉ À FIREBASE</span>
  </div>
</header>

<main class="max-w-5xl mx-auto p-4">
  <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white rounded-3xl p-6 mb-6">
    <h2 class="text-2xl font-black">MAKOLA IA</h2>
    <p class="opacity-80">Durba • Système en ligne - Les données ne s'effacent plus!</p>
    <p id="produit-count" class="mt-2 bg-white/20 inline-block px-3 py-1 rounded-full text-sm">Chargement...</p>
  </div>

  <!-- FORMULAIRE -->
  <div class="bg-white rounded-2xl p-5 shadow mb-6">
    <h3 class="font-bold mb-4"><i class="fas fa-plus"></i> Ajouter Produit</h3>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
      <input id
