// CONVERTIT LIEN YOUTUBE EN ID
function getYoutubeId(url){
  if(!url)return '';
  const m=url.match(/(?:youtube\.com\/shorts\/|youtu\.be\/|youtube\.com\/watch\?v=|youtube\.com\/embed\/)([^&\?\/]+)/);
  if(m)return m[1];
  return '';
}
