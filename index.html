<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V - YouTube Masisi</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

<header class="flex justify-between items-center p-3 border-b sticky top-0 bg-white z-50">
<h1 class="font-bold">FREDDY-V <span class="bg-red-600 text-white px-1 rounded">TV</span></h1>
<a href="publier.html" class="bg-red-600 text-white px-4 py-1 rounded-full text-sm">+ Publier</a>
</header>

<div id="videos" class="p-3">
<p id="status" class="text-center text-gray-500 mt-10">Chargement... ⏳ Lecture config depuis publier.html</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

async function init(){
  const status = document.getElementById('status');
  try{
    // 1. On lit publier.html pour prendre la même config Firebase
    const resp = await fetch('./publier.html');
    const text = await resp.text();
    
    // Extrait firebaseConfig
    const match = text.match(/const firebaseConfig = \{([\s\S]*?)\};/);
    if(!match) throw new Error("Config non trouvée dans publier.html");
    
    // Reconstruit l'objet config
    const configStr = "{"+match[1]+"}";
    const cfg = eval("("+configStr+")"); // parse simple
    
    status.innerText = "Config trouvée! Chargement vidéos...";
    
    const app = initializeApp(cfg);
    const db = getFirestore(app);
    const q = query(collection(db, "videos"), orderBy("timestamp","desc"));
    const snap = await getDocs(q);
    
    const c = document.getElementById('videos');
    if(snap.empty){
      c.innerHTML = `<div class="text-center p-10">📭 Aucune vidéo<br><a href="publier.html" class="bg-red-600 text-white px-6 py-2 rounded-full mt-4 inline-block">+ Publier</a></div>`;
      return;
    }
    
    let html="";
    snap.forEach(d=>{
      const v=d.data();
      const date = v.timestamp ? new Date(v.timestamp.seconds*1000).toLocaleDateString() : 'Aujourd\'hui';
      html+=`<div class="flex gap-3 border-b pb-3 mb-3"><div class="w-36 h-20 bg-black rounded-lg flex items-center justify-center text-white">▶️</div><div><h3 class="font-bold text-sm">${v.titre}</h3><p class="text-xs text-gray-500">${v.auteur||'Freddy'} • ${date}</p><a href="${v.url}" target="_blank" class="text-xs bg-red-600 text-white px-2 py-1 rounded mt-1 inline-block">Voir</a></div></div>`;
    });
    c.innerHTML = html;
    
  }catch(e){
    document.getElementById('videos').innerHTML = `<p class="text-red-600 text-center p-4">Erreur: ${e.message}<br>Assure-toi que publier.html existe!</p>`;
    console.error(e);
  }
}
init();
</script>
</body>
</html>
