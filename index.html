<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREDDY-V Mondial - @MakolaKibwe</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.header{background:#111;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:red;font-weight:bold;font-size:18px}
.btn{padding:8px 12px;border-radius:20px;text-decoration:none;font-weight:bold;font-size:13px;display:inline-block}
.btn-red{background:red;color:#fff}
.btn-white{background:#fff;color:#000}
.yt-banner{background:linear-gradient(90deg,red,#900);padding:12px;text-align:center}
.yt-banner a{background:#fff;color:red;padding:10px 20px;border-radius:25px;text-decoration:none;font-weight:bold;display:inline-block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#111;border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
.card img,.card video{width:100%;display:block;background:#222;object-fit:cover}
.card.short img,.card.short video{aspect-ratio:9/16} .card.normal img,.card.normal video{aspect-ratio:16/9}
.info{position:absolute;bottom:0;left:0;right:0;padding:6px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,0.9))}
#player{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;z-index:100;justify-content:center;align-items:center}
#player iframe,#player video{width:100%;max-width:500px;border:0}
#player iframe.short,#player video.short{aspect-ratio:9/16} #player iframe.normal,#player video.normal{aspect-ratio:16/9}
#close{position:absolute;top:15px;right:15px;background:red;color:#fff;border:0;padding:10px 15px;border-radius:50%}
</style></head><body>

<div class="yt-banner">
  🌍 <b>FREDDY-V</b> par <b>Makola Kibwe</b> 
  <br><br>
  <a href="https://www.youtube.com/@MakolaKibwe?sub_confirmation=1" target="_blank">🔴 S'ABONNER @MakolaKibwe sur YouTube</a>
  <div style="font-size:11px;margin-top:6px;color:#ffcccc">Clique ici → Abonne-toi → Tu aides Jésus revient + Maçon Électricité à devenir mondial!</div>
</div>

<div class="header">
  <div class="logo">FREDDY-V</div>
  <div>
    <a class="btn btn-white" href="https://www.youtube.com/@MakolaKibwe" target="_blank">Voir ma chaîne</a>
    <a class="btn btn-red" href="ma-chaine.html">Ma Chaîne + Publier</a>
  </div>
</div>

<div id="list" class="grid"></div>

<div id="player"><button id="close" onclick="document.getElementById('player').style.display='none';document.getElementById('pContent').innerHTML=''">✕</button><div id="pContent" style="width:100%;display:flex;justify-content:center"></div></div>

<script>
const cfg={apiKey:"AIzaSyCZTfMR94q2t4W1c0N7LK5YpN14M8iBVvA",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v"};
firebase.initializeApp(cfg); const db=firebase.firestore();
function playYT(id,short){const c=short?'short':'normal';document.getElementById('pContent').innerHTML=`<iframe class="${c}" src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen></iframe>`;document.getElementById('player').style.display='flex';}
function playFile(url){document.getElementById('pContent').innerHTML=`<video class="normal" src="${url}" controls autoplay></video>`;document.getElementById('player').style.display='flex';}
async function load(){
 const s=await db.collection('videos').orderBy('created','desc').limit(100).get();
 const l=document.getElementById('list'); l.innerHTML='';
 s.forEach(d=>{
  const v=d.data(); let html='',cls=v.isShort?'short':'normal',click='';
  if(v.youtubeId){click=`playYT('${v.youtubeId}',${v.isShort===true})`; html=`<img src="https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg">`;}
  else if(v.videoUrl){click=`playFile('${v.videoUrl}')`; html=`<video src="${v.videoUrl}" muted></video>`;}
  else return;
  l.innerHTML+=`<div class="card ${cls}" onclick="${click}">${html}<div class="info"><b>${(v.title||'Vidéo').substring(0,28)}</b><br>${v.youtubeId?(v.isShort?'SHORT':'NORMALE'):'TÉLÉPHONE'}</div></div>`;
 });
}
load();
</script>
</body></html>
