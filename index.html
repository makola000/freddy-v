<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V - YouTube de Masisi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",
  authDomain: "freddy-v.firebaseapp.com",
  projectId: "freddy-v",
  storageBucket: "freddy-v.firebasestorage.app",
  messagingSenderId: "318263144332",
  appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allVideos = [];

window.loadVideos = async () => {
  const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snap)=>{
    allVideos = [];
    const grid = document.getElementById('videoGrid');
    const shorts = document.getElementById('shortsGrid');
    grid.innerHTML = ""; shorts.innerHTML = "";
    
    if(snap.empty){
      grid.innerHTML = `<div class='col-span-2 text-center p-10 text-gray-500'>Aucune vidéo. Sois le premier à publier! <br><a href='publier.html' class='text-red-600 font-bold underline'>Publier une vidéo</a></div>`;
      return;
    }

    snap.forEach(d=>{
      const v = {id: d.id, ...d.data()};
      allVideos.push(v);
      if(v.type === 'short'){
        shorts.innerHTML += `
        <div onclick="openShort('${v.id}')" class="w-[160px] flex-shrink-0 cursor-pointer">
          <div class="h-[280px] bg-black rounded-xl overflow-hidden relative">
            <img src="${v.thumbnail || 'https://via.placeholder.com/160x280?text=FREDDY-V'}" class="w-full h-full object-cover">
            <div class="absolute bottom-1 left-1 bg-black/70 text-white text-[10px] px-1 rounded">${v.vues||0} vues</div>
          </div>
          <p class="text-sm font-bold line-clamp-2 mt-1 leading-tight">${v.titre}</p>
          <p class="text-xs text-gray-500">${v.vues||0} vues</p>
        </div>`;
      } else {
        grid.innerHTML += `
        <div class="bg-white rounded-xl overflow-hidden cursor-pointer" onclick="openVideo('${v.id}')">
          <div class="aspect-video bg-black relative">
            <img src="${v.thumbnail || 'https://via.placeholder.com/400x220?text=FREDDY-V'}" class="w-full h-full object-cover">
            <span class="absolute bottom-2 right-2 bg-black/80 text-white text-xs px-1 rounded">${v.duree||'0:32'}</span>
          </div>
          <div class="p-3 flex gap-3">
            <div class="w-8 h-8 bg-red-600 rounded-full flex-shrink-0 flex items-center justify-center text-white font-black text-xs">${(v.auteur||'M')[0]}</div>
            <div class="flex-1">
              <h3 class="font-bold text-sm line-clamp-2 leading-tight">${v.titre}</h3>
              <p class="text-xs text-gray-500 mt-1">${v.auteur||'Makola Freddy'} • ${v.vues||0} vues • il y a 2h</p>
              <div class="flex gap-3 mt-2 text-xs">
                <button onclick="event.stopPropagation(); like('${v.id}')" class="flex items-center gap-1"><i class="fa-regular fa-thumbs-up"></i> ${v.likes||0}</button>
                <button onclick="event.stopPropagation(); telecharger('${v.id}')" class="flex items-center gap-1"><i class="fa-solid fa-download"></i> Télécharger</button>
              </div>
            </div>
            <i class="fa-solid fa-ellipsis-vertical text-gray-400"></i>
          </div>
        </div>`;
      }
    });
  });
};

window.openShort = (id) => {
  const v = allVideos.find(x=>x.id===id);
  document.getElementById('shortModal').classList.remove('hidden');
  document.getElementById('shortVideoSrc').src = v.url || '';
  document.getElementById('shortTitre').textContent = v.titre;
  document.getElementById('shortAuteur').textContent = "@"+(v.auteur||'makola');
  document.getElementById('shortVues').textContent = (v.vues||0)+" vues";
  document.getElementById('shortLikeCount').textContent = v.likes||0;
  // +1 vue
  updateDoc(doc(db, "videos", id), {vues: increment(1)});
  updateDoc(doc(db, "createurs", "global"), {vues: increment(1)}).catch(()=>{});
};
window.closeShort = () => { document.getElementById('shortModal').classList.add('hidden'); document.getElementById('shortVideoSrc').src=""; };

window.openVideo = (id) => {
  const v = allVideos.find(x=>x.id===id);
  document.getElementById('watchModal').classList.remove('hidden');
  document.getElementById('watchVideo').src = v.url || '';
  document.getElementById('watchTitre').textContent = v.titre;
  document.getElementById('watchVues').textContent = (v.vues||0)+" vues";
  document.getElementById('watchAuteur').textContent = v.auteur||'Makola Freddy';
  loadComments(id);
  updateDoc(doc(db, "videos", id), {vues: increment(1)});
};

window.like = async (id) => { await updateDoc(doc(db, "videos", id), {likes: increment(1)}); };
window.enregistrer = () => { alert('✅ Vidéo enregistrée dans "Mon Compte"'); };
window.part
