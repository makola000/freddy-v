<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}</style>
</head>
<body class="bg-gray-100 pb-20">

<!-- HEADER AVEC TA CHAINE -->
<header class="bg-white sticky top-0 z-40 border-b px-3 py-2.5 flex justify-between items-center">
<a href="index.html" class="flex items-center gap-1">
<span class="bg-red-600 text-white font-black px-3 py-1 rounded-md text-sm">FREDDY</span>
<span class="font-black text-sm">-V</span>
</a>
<div class="flex items-center gap-2">
<a href="ma-chaine.html" class="flex items-center gap-1.5 bg-gray-100 px-2.5 py-1 rounded-full">
<div class="w-6 h-6 bg-red-600 rounded-full flex items-center justify-center text-white text-[10px] font-black">MF</div>
<span class="text-xs font-bold">Ma chaîne</span>
</a>
<a href="publier.html" class="bg-black text-white px-4 py-1.5 rounded-full text-sm font-bold"><i class="fa fa-plus mr-1"></i> Publier</a>
</div>
</header>

<!-- PLAYER VIDEO -->
<div id="player" class="hidden bg-black sticky top-[49px] z-50">
<div id="playerBox" class="w-full"></div>
<button onclick="closePlayer()" class="w-full bg-zinc-800 text-white text-xs py-3 flex items-center justify-center gap-2"><i class="fa fa-times"></i> Fermer la vidéo</button>
</div>

<!-- VIDEOS NORMALES -->
<div class="bg-white mt-1 p-3">
<h2 class="font-black text-sm mb-3 flex items-center gap-2"><i class="fa fa-play text-red-600"></i> Vidéos</h2>
<div id="videosList" class="grid grid-cols-1 gap-3"></div>
</div>

<!-- SHORTS -->
<div class="bg-white mt-2 p-3">
<h2 class="font-black text-sm mb-3 flex items-center gap-2"><span class="bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded">SHORTS</span> Shorts</h2>
<div id="shortsList" class="grid grid-cols-2 gap-3"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM", authDomain: "freddy-v.firebaseapp.com", projectId: "freddy-v", storageBucket: "freddy-v.firebasestorage.app", messagingSenderId: "318263144332", appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getId(url){ if(!url) return ""; let id=""; if(url.includes("youtu.be/")) id=url.split("youtu.be/")[1].split("?")[0].split("&")[0]; else if(url.includes("watch?v=")) id=url.split("watch?v=")[1].split("&")[0].split("?")[0]; else if(url.includes("shorts/")) id=url.split("shorts/")[1].split("?")[0].split("&")[0]; return id.substring(0,11); }
function toEmbed(url){ return "https://www.youtube.com/embed/"+getId(url); }
window.closePlayer=function(){ document.getElementById('player').classList.add('hidden'); document.getElementById('playerBox').innerHTML=''; }
window.playVideo=async function(url, docId){
  const embed=toEmbed(url);
  document.getElementById('playerBox').innerHTML=`<iframe src="${embed}?autoplay=1" class="w-full h-[240px] md:h-[400px]" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  document.getElementById('player').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
  if(docId){ try{ await updateDoc(doc(db,"videos",docId),{vues:increment(1)}); }catch(e){} }
}

async function load(){
  const snap = await getDocs(collection(db,"videos"));
  let videosHTML=""; let shortsHTML="";
  snap.forEach(d=>{
    const v=d.data(); const vidId=getId(v.url); if(!vidId) return;
    const thumb=`https://img.youtube.com/vi/${vidId}/mqdefault.jpg`;
    const card=`<div onclick="playVideo('${v.url}','${d.id}')" class="cursor-pointer"><img src="${thumb}" class="w-full h-40 object-cover rounded-xl"><h3 class="font-bold text-[13px] mt-2 line-clamp-2">${v.titre}</h3><p class="text-[11px] text-gray-500 mt-1">${v.vues||0} vues • ${v.auteur||'FREDDY-V'}</p></div>`;
    const shortCard=`<div onclick="playVideo('${v.url}','${d.id}')" class="cursor-pointer"><img src="${thumb}" class="w-full h-48 object-cover rounded-xl"><h3 class="font-bold text-[12px] mt-1 line-clamp-2">${v.titre}</h3><p class="text-[11px] text-gray-500">${v.vues||0} vues</p></div>`;
    if((v.type||"").toLowerCase().includes("short")) shortsHTML+=shortCard; else videosHTML+=card;
  });
  document.getElementById('videosList').innerHTML=videosHTML||"<p class='text-xs text-gray-400'>Pas de vidéos</p>";
  document.getElementById('shortsList').innerHTML=shortsHTML||"<p class='text-xs text-gray-400'>Pas de Shorts</p>";
}
load();
</script>
</body>
</html>
