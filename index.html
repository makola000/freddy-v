<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY V - KOLWEZI | Plateforme Vidéo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff}
header{background:linear-gradient(135deg,#ff6a00,#ee0979);padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo b{font-size:32px;line-height:1}
.logo h1{font-size:18px}
.logo span{font-size:11px;opacity:.9;display:block}
.search{flex:1;max-width:400px;display:flex}
.search input{flex:1;padding:10px;border:none;border-radius:20px 0 0 20px;outline:none;color:#000}
.search button{padding:10px 16px;border:none;background:#000;color:#fff;border-radius:0 20px 20px 0;cursor:pointer}
.actions{display:flex;gap:8px;align-items:center}
.btn{padding:8px 16px;border:none;border-radius:20px;cursor:pointer;font-weight:bold}
.btn-orange{background:#fff;color:#ff4500}
.btn-green{background:#25D366;color:#fff}
.btn-dark{background:#272727;color:#fff}
#home{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:16px}
.card{background:#1f1f1f;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:scale(1.02)}
.thumb{height:170px;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
.thumb iframe{width:100%;height:100%;border:none}
.thumb .play{font-size:40px}
.card-body{padding:10px}
.card-body h3{font-size:15px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:#aaa;display:flex;gap:10px}
#watch{display:none;padding:16px;max-width:1200px;margin:auto}
.video-player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:12px}
.video-player iframe{width:100%;height:100%;border:none}
.watch-info h2{margin:10px 0}
.channel{display:flex;align-items:center;justify-content:space-between;background:#1f1f1f;padding:10px;border-radius:10px;margin:12px 0}
.subscribe{background:#ff0000;color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:bold}
.comments{margin-top:20px}
.comments input{width:100%;padding:12px;border-radius:20px;border:none;background:#272727;color:#fff;outline:none;margin-bottom:10px}
.comment{background:#1f1f1f;padding:8px 10px;border-radius:8px;margin-bottom:8px;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-content{background:#212121;padding:20px;border-radius:12px;width:100%;max-width:450px}
.modal-content input,.modal-content textarea{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none;background:#000;color:#fff}
.monetize{background:#1f1f1f;border:1px dashed #ff6a00;padding:12px;border-radius:10px;margin:16px;text-align:center}
</style>
</head>
<body>

<header>
<div class="logo" onclick="showHome()">
<b>FV</b>
<div><h1>FREDDY V - KOLWEZI</h1><span>Scientifique | Croyant en Jesus-Christ</span></div>
</div>
<div class="search"><input id="q" placeholder="Rechercher vidéos..." oninput="search()"><button onclick="search()">🔍</button></div>
<div class="actions">
<button class="btn btn-dark" onclick="openModal('publishModal')">+ Publier</button>
<button class="btn btn-orange" onclick="openModal('authModal')" id="authBtn">Compte</button>
<button class="btn btn-green" onclick="window.open('https://wa.me/243983356734','_blank')">WhatsApp</button>
</div>
</header>

<div class="monetize">
💰 <b>Gagne avec FREDDY V:</b> Chaque visite aide! Soutien M-Pesa: <b style="color:#ff6a00">0983356734</b> | 1 vue = 1 soutien | Abonne-toi!
</div>

<div id="home"></div>

<div id="watch">
<button class="btn btn-dark" onclick="showHome()">← Retour</button>
<div class="video-player" id="player"></div>
<div class="watch-info">
<h2 id="wTitle"></h2>
<div class="meta"><span id="wViews"></span> • <span id="wDate"></span></div>
<div class="channel">
<div><b id="wChannel"></b><br><small id="wSubs" style="color:#aaa"></small></div>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="like()">👍 <span id="wLikes">0</span></button>
<button class="subscribe" onclick="subscribe()" id="subBtn">S'abonner</button>
</div>
</div>
<p id="wDesc" style="background:#1f1f1f;padding:10px;border-radius:8px;margin-top:10px"></p>
<div class="comments">
<h3>Commentaires</h3>
<input id="cInput" placeholder="Ajoute un commentaire..." onkeydown="if(event.key==='Enter')addComment()">
<div id="cList"></div>
</div>
</div>
</div>

<!-- AUTH MODAL -->
<div class="modal" id="authModal">
<div class="modal-content">
<h3>Compte FREDDY V</h3>
<input id="aName" placeholder="Ton nom (ex: Freddy)">
<input id="aEmail" placeholder="Email">
<input id="aPass" type="password" placeholder="Mot de passe">
<button class="btn btn-orange" style="width:100%;margin-top:10px" onclick="register()">Créer mon compte / Se connecter</button>
<p id="aMsg" style="font-size:12px;margin-top:8px;color:#aaa"></p>
<button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="closeModal('authModal')">Fermer</button>
</div>
</div>

<!-- PUBLISH MODAL -->
<div class="modal" id="publishModal">
<div class="modal-content">
<h3>Publier une vidéo</h3>
<input id="vTitle" placeholder="Titre de ta vidéo">
<textarea id="vDesc" placeholder="Description..."></textarea>
<input id="vLink" placeholder="Colle lien YouTube (ex: https://youtube.com/watch?v=...)">
<p style="font-size:11px;color:#aaa">Astuce: Copie lien YouTube de ta vidéo. On l'affiche automatiquement.</p>
<button class="btn btn-orange" style="width:100%;margin-top:10px" onclick="publish()">Publier maintenant</button>
<button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="closeModal('publishModal')">Annuler</button>
</div>
</div>

<script>
let users=JSON.parse(localStorage.getItem('fv_users')||'[]');
let videos=JSON.parse(localStorage.getItem('fv_videos')||'[]');
let currentUser=JSON.parse(localStorage.getItem('fv_current')||'null');
let currentWatch=null;

if(videos.length==0){
 videos=[{id:'1',title:'Bienvenue sur FREDDY V - Jesus-Christ est Seigneur',desc:'La science cherche, Jesus sauve. Première vidéo de la plateforme FREDDY V de Kolwezi.',youtubeId:'dQw4w9WgXcQ',userName:'FREDDY V',userEmail:'freddy@kolwezi.cd',views:128,likes:24,comments:[{name:'Fan Kolwezi',text:'Gloire à Dieu!'}],date:new Date().toLocaleDateString()}];
 save();
}

function save(){localStorage.setItem('fv_users',JSON.stringify(users));localStorage.setItem('fv_videos',JSON.stringify(videos));localStorage.setItem('fv_current',JSON.stringify(currentUser));}
function getYtId(url){if(!url)return null;let m=url.match(/(?:v=|\.be\/|shorts\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null;}
function openModal(id){document.getElementById(id).style.display='flex';}
function closeModal(id){document.getElementById(id).style.display='none';}

function register(){
 let name=document.getElementById('aName').value.trim();
 let email=document.getElementById('aEmail').value.trim();
 let pass=document.getElementById('aPass').value.trim();
 if(!name||!email){document.getElementById('aMsg').innerText='Remplis nom et email';return;}
 let u=users.find(x=>x.email==email);
 if(!u){u={id:Date.now().toString(),name,email,pass,subs:[]};users.push(u);}
 currentUser=u; save();
 document.getElementById('authBtn').innerText=u.name;
 document.getElementById('aMsg').innerText='Connecté! Tu peux publier maintenant.';
 setTimeout(()=>closeModal('authModal'),1000);
}

function publish(){
 if(!currentUser){alert('Crée ton compte d\'abord!');openModal('authModal');return;}
 let title=document.getElementById('vTitle').value.trim();
 let desc=document.getElementById('vDesc').value.trim();
 let link=document.getElementById('vLink').value.trim();
 let ytId=getYtId(link);
 if(!title||!ytId){alert('Titre + lien YouTube valide obligatoire');return;}
 let v={id:Date.now().toString(),title,desc,youtubeId:ytId,userName:currentUser.name,userEmail:currentUser.email,views:0,likes:0,comments:[],date:new Date().toLocaleDateString()};
 videos.unshift(v); save(); closeModal('publishModal'); render(videos);
 alert('Vidéo publiée! Les gens peuvent la voir maintenant.');
}

function render(list){
 let h=document.getElementById('home');
 h.innerHTML=list.map(v=>`
 <div class="card" onclick="watch('${v.id}')">
 <div class="thumb"><iframe src="https://www.youtube.com/embed/${v.youtubeId}" loading="lazy"></iframe></div>
 <div class="card-body">
 <h3>${v.title}</h3>
 <div class="meta"><span>${v.userName}</span><span>${v.views} vues</span></div>
 <div class="meta"><span>${v.likes} likes • ${v.comments.length} commentaires</span></div>
 </div></div>`).join('');
}

function watch(id){
 let v=videos.find(x=>x.id==id);
 if(!v)return;
 currentWatch=v; v.views++; save();
 document.getElementById('home').style.display='none';
 document.getElementById('watch').style.display='block';
 document.getElementById('player').innerHTML=`<iframe src="https://www.youtube.com/embed/${v.youtubeId}?autoplay=1" allowfullscreen></iframe>`;
 document.getElementById('wTitle').innerText=v.title;
 document.getElementById('wViews').innerText=v.views+' vues';
 document.getElementById('wDate').innerText=v.date;
 document.getElementById('wChannel').innerText=v.userName;
 document.getElementById('wSubs').innerText=v.userEmail;
 document.getElementById('wLikes').innerText=v.likes;
 document.getElementById('wDesc').innerText=v.desc;
 renderComments();
 window.scrollTo(0,0);
}

function showHome(){document.getElementById('watch').style.display='none';document.getElementById('home').style.display='grid';render(videos);}
function like(){if(!currentWatch)return;currentWatch.likes++;save();document.getElementById('wLikes').innerText=currentWatch.likes;}
function addComment(){
 let t=document.getElementById('cInput').value.trim(); if(!t||!currentWatch)return;
 let name=currentUser?currentUser.name:'Visiteur';
 currentWatch.comments.push({name,text:t}); save(); document.getElementById('cInput').value=''; renderComments();
}
function renderComments(){document.getElementById('cList').innerHTML=(currentWatch.comments||[]).map(c=>`<div class="comment"><b>${c.name}:</b> ${c.text}</div>`).join('');}
function subscribe(){alert('Tu es abonné à '+currentWatch.userName+'! Il verra 1 abonné en plus.');}
function search(){let s=document.getElementById('q').value.toLowerCase();let f=videos.filter(v=>v.title.toLowerCase().includes(s)||v.userName.toLowerCase().includes(s));render(f);}
if(currentUser)document.getElementById('authBtn').innerText=currentUser.name;
render(videos);
</script>
</body>
</html>
