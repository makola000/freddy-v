<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créer Chaîne - FREDDY-V</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:20px;margin:0}
.card{background:#111;padding:20px;border-radius:16px;max-width:400px;margin:30px auto}
input{width:100%;padding:14px;margin:8px 0;border-radius:10px;background:#222;color:#fff;border:0;box-sizing:border-box}
button{background:red;color:#fff;border:0;padding:14px;width:100%;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h3 style="text-align:center">🎬 Créer nouvelle chaîne FREDDY-V</h3>
<input id="nom" value="Makola Freddy">
<input id="tel" value="+243983356734">
<button id="btn">Créer ma chaîne maintenant</button>
<p id="msg" style="text-align:center;margin-top:15px"></p>
<a href="index.html" style="color:#aaa;display:block;text-align:center;margin-top:15px;text-decoration:none">← Accueil</a>
</div>
<script>
const cfg={apiKey:"AIzaSyCZTfMR94q2t4W1c0N7LK5YpN14M8iBVvA",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.firestore();
document.getElementById('btn').onclick=async()=>{
 const nom=document.getElementById('nom').value.trim();
 const tel=document.getElementById('tel').value.trim();
 const m=document.getElementById('msg');
 const btn=document.getElementById('btn');
 if(!nom||!tel){m.innerHTML='❌ Remplis';return;}
 btn.disabled=true; m.innerHTML='⏳ Création...';
 try{
  await db.collection('chaines').doc(tel).set({
    name:nom, ownerName:nom, owner:tel, tel:tel,
    totalVideos:0, totalViews:0, subscribers:0,
    created:new Date(), photo:''
  });
  m.innerHTML='✅ Chaîne créée! Redirection...';
  setTimeout(()=>location.href='ma-chaine.html',1500);
 }catch(e){m.innerHTML='❌ '+e.message; btn.disabled=false;}
};
</script>
</body>
</html>
