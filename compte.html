<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compte - FREDDY-V</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:15px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:20px;max-width:400px;margin:20px auto}
input,select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:0;background:#222;color:#fff;box-sizing:border-box}
button{background:red;color:#fff;border:0;padding:14px;width:100%;border-radius:12px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div onclick="location.href='index.html'" style="cursor:pointer">← FREDDY-V Accueil (3 vidéos)</div>

<div class="card">
<h2>Créer ton compte mondial</h2>
<input id="name" value="Freddy makola">
<select id="country"><option value="+243">🇨🇩 +243 Congo</option><option value="+250">🇷🇼 +250 Rwanda</option></select>
<input id="phone" value="983356734">
<input id="email" value="kibwemakola@gmail.com">
<button id="btnCreate">🌍 Créer compte mondial (Firebase)</button>
<p id="msg" style="color:#aaa;margin-top:12px;text-align:center">Coffre-fort Firebase sécurisé 🔒<br>80% pour toi, 20% FREDDY-V</p>
</div>

<script>
// CONFIG FIREBASE - TON COFFRE-FORT
const cfg={apiKey:"AIzaSyCZTfMR94q2t4W1c0N7LK5YpN14M8iBVvA",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.firestore();

document.getElementById('btnCreate').addEventListener('click', async function(){
  const name=document.getElementById('name').value.trim();
  let phone=document.getElementById('phone').value.trim();
  const email=document.getElementById('email').value.trim();
  const country=document.getElementById('country').value;
  const msg=document.getElementById('msg');
  const btn=document.getElementById('btnCreate');
  
  if(!name || !phone){msg.innerHTML="❌ Mets nom et numéro";return;}
  
  phone=phone.replace(/\+/g,'').replace(/^0/,'').replace(/^243/,'');
  const fullPhone=country+phone;
  
  btn.innerText="⏳ Sauvegarde dans coffre-fort...";
  msg.innerHTML="🔒 Connexion au coffre-fort Firebase...";
  
  const userData={
    name:name,
    phone:fullPhone,
    email:email,
    country:country,
    balance:0,
    totalViews:0,
    earnings:0,
    created: firebase.firestore.FieldValue.serverTimestamp()
  };
  
  try{
    // SAUVE DANS FIREBASE - LE COFFRE-FORT
    await db.collection("users").doc(fullPhone).set(userData);
    
    // SAUVE AUSSI LOCAL
    localStorage.setItem('freddy_user', JSON.stringify(userData));
    
    msg.innerHTML="✅ Compte créé dans le coffre-fort Firebase! 🌍🔒<br>Bienvenue "+name+"!";
    btn.innerText="✅ Compte créé!";
    
    setTimeout(()=>{window.location.href='index.html';},1500);
    
  }catch(e){
    msg.innerHTML="⚠️ Firebase: "+e.message+"<br>Mais compte sauvé localement!";
    localStorage.setItem('freddy_user', JSON.stringify(userData));
    setTimeout(()=>{window.location.href='index.html';},2000);
  }
});
</script>
</body>
</html>
