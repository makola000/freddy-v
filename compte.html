<script>
// COFFRE-FORT FIREBASE - NE PAS ENLEVER
const cfg={apiKey:"AIzaSyCZTfMR94q2t4W1c0N7LK5YpN14M8iBVvA",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.firestore();

document.getElementById('btnCreate').addEventListener('click', async function(){
  const name=document.getElementById('name').value.trim();
  let phone=document.getElementById('phone').value.trim();
  const email=document.getElementById('email').value.trim();
  const country=document.getElementById('country').value;
  const msg=document.getElementById('msg');
  const btn=document.getElementById('btnCreate');
  
  if(!name){msg.innerHTML="❌ Mets ton nom";return;}
  if(!phone){msg.innerHTML="❌ Mets ton numéro";return;}
  
  phone=phone.replace(/\+/g,'').replace(/^0/,'').replace(/^243/,'');
  const fullPhone=country+phone;
  
  btn.innerText="⏳ Sauvegarde...";
  btn.disabled=true;
  msg.innerHTML="🔒 Connexion au coffre-fort Firebase...";
  
  const userData={
    name:name,
    phone:fullPhone,
    email:email,
    country:country,
    balance:0,
    totalViews:0,
    earnings:0,
    created: firebase.firestore.FieldValue.serverTimestamp()
  };
  
  try{
    await db.collection("users").doc(fullPhone).set(userData);
    localStorage.setItem('freddy_user', JSON.stringify(userData));
    msg.innerHTML="✅ Compte créé dans Firebase! 🌍🔒<br>Bienvenue "+name+"!<br>Redirection...";
    btn.innerText="✅ Compte créé!";
    setTimeout(()=>{window.location.href='index.html';},1500);
  }catch(e){
    msg.innerHTML="⚠️ Erreur Firebase: "+e.message+"<br>Compte sauvé localement!";
    localStorage.setItem('freddy_user', JSON.stringify(userData));
    setTimeout(()=>{window.location.href='index.html';},2000);
  }
});
</script>
