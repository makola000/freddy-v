<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FREDDY-V Worldwide</title><style>body{background:#000;color:#fff;font-family:Arial;padding:15px;max-width:500px;margin:auto}header{text-align:center;padding:10px;font-weight:bold}.card{background:#111;padding:20px;border-radius:16px;margin:12px 0;border:1px solid #222}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:8px 0}button{width:100%;padding:14px;border-radius:10px;border:0;background:red;color:#fff;font-weight:bold;cursor:pointer;font-size:15px}small{opacity:0.6} .lang{display:flex;gap:8px;justify-content:center;margin:8px} .lang button{width:auto;padding:6px 12px;background:#222;font-size:12px}</style></head><body>
<header>🌍 FREDDY-V MONDIAL</header>
<div class="lang"><button onclick="setLang('fr')">FR</button><button onclick="setLang('en')">EN</button><button onclick="setLang('sw')">SW</button></div>
<div class="card" id="form"><h3 id="t1">Créer ton compte mondial</h3><input id="name" placeholder="Nom" value="Freddy makola"><select id="country"><option value="+243" selected>🇨🇩 +243 Congo</option><option value="+33">🇫🇷 +33 France</option><option value="+1">🇺🇸 +1 USA</option><option value="+32">🇧🇪 +32 Belgique</option><option value="+44">🇬🇧 +44 UK</option><option value="+other">🌍 Other</option></select><input id="phone" placeholder="Phone" value="+243983356734"><input id="email" placeholder="Email" value="kibwemakola@gmail.com"><button onclick="create()" id="btn">🌍 Créer compte mondial</button><p id="msg" style="color:yellow"></p><small id="info">80% pour toi, 20% FREDDY-V. Paiement mondial.</small></div>
<div class="card" id="dash" style="display:none"><h3 id="hello"></h3><p>💰 Solde: $<b id="bal">0.000</b></p><p>📱 <span id="p1"></span></p><button onclick="location.href='upload.html'">📤 PUBLIER NORMALE + SHORTS</button><button onclick="location.href='index.html'" style="background:#222;margin-top:10px">🏠 Accueil</button><button onclick="logout()" style="background:#444;margin-top:10px">Logout</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,push}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const cfg={apiKey:"AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",authDomain:"freddy-v.firebaseapp.com",databaseURL:"https://freddy-v-default-rtdb.firebaseio.com",projectId:"freddy-v",storageBucket:"freddy-v.firebasestorage.app",messagingSenderId:"318263144332",appId:"1:318263144332:web:387b2ded7cf5b85d6eb0a9"};
const app=initializeApp(cfg);const db=getDatabase(app);
let u=JSON.parse(localStorage.getItem('freddy_user')||'null');if(u)show(u);
window.create=async()=>{
 let name=document.getElementById('name').value.trim();
 let phone=document.getElementById('phone').value.trim();
 let email=document.getElementById('email').value.trim();
 let country=document.getElementById('country').value;
 let msg=document.getElementById('msg');
 if(!name||!phone){msg.innerText='Nom et phone requis';return}
 msg.innerText='⏳ Création...';
 let user={username:name,phone:phone,email:email,country:country,uid:Date.now().toString(),balance:0,worldwide:true,time:Date.now()};
 try{await push(ref(db,'users'),user); msg.innerText='✅ Compte gardé dans Firebase!';}
 catch(e){msg.innerText='✅ Compte local (Firebase: '+e.message+')';}
 localStorage.setItem('freddy_user',JSON.stringify(user));
 setTimeout(()=>{show(user);alert('🌍 Bienvenue '+name+'! Compte créé avec '+phone)},500);
};
function show(user){document.getElementById('form').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('hello').innerText='Salut '+user.username+' 🔥';document.getElementById('p1').innerText=user.phone;document.getElementById('bal').innerText='0.000'}
window.logout=()=>{localStorage.removeItem('freddy_user');location.reload()}
window.setLang=(l)=>{localStorage.setItem('freddy_lang',l)}
</script></body></html>
