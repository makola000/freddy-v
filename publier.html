<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Publier - FREDDY-V</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-white p-4">
<div class="max-w-md mx-auto bg-white p-6 rounded-2xl mt-10 border shadow">
<h1 class="font-black text-xl">📤 Publier sur FREDDY-V</h1>
<input id="titre" placeholder="Titre vidéo" class="w-full p-3 border-2 rounded-xl mt-4">
<input id="url" placeholder="Lien vidéo: https://www.w3schools.com/html/mov_bbb.mp4" class="w-full p-3 border-2 rounded-xl mt-3">
<select id="type" class="w-full p-3 border-2 rounded-xl mt-3"><option value="video">Vidéo normale</option><option value="short">Shorts</option></select>
<button onclick="alert('✅ Vidéo publiée! Retour accueil'); location.href='index.html'" class="w-full bg-red-600 text-white py-4 rounded-xl font-black mt-6">🚀 PUBLIER</button>
<a href="index.html" class="block text-center mt-4 underline">← Retour</a>
</div>
</body>
</html>
