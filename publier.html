<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Publier - FREDDY-V</title><script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v",storageBucket:"freddy-v.firebasestorage.app",messagingSenderId:"318263144332",appId:"1:318263144332:web:387b2ded7cf5b85d6eb0a9"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
window.publier=async()=>{
const tel=localStorage.getItem('freddy_tel');const nom=localStorage.getItem('freddy_nom');
if(!tel){alert("Connecte-toi d'abord");location.href="connexion.html";return;}
const titre=document.getElementById('titre').value.trim();const lien=document.getElementById('lien').value.trim();
const btn=document.getElementById('btnPub');const msg=document.getElementById('msg');
if(!titre||!lien){msg.innerHTML=`<div class='bg-red-100 p-3 rounded'>Titre + Lien YouTube ou MP4 obligatoire</div>`;return;}
btn.textContent="Publication...";btn.disabled=true;
try{await addDoc(collection(db,"videos"),{titre:titre, lien:lien, ownerTel:tel, ownerNom:nom, vues:0, date:new Date().toISOString(), revenusOwner:0, revenusFreddy:0});
msg.innerHTML=`<div class='bg-green-100 p-3 rounded'>Vidéo publiée! 🎉</div>`;setTimeout(()=>location.href="index.html",1000);
}catch(e){msg.innerHTML=`<div class='bg-red-100 p-3 rounded'>Erreur: ${e.message}</div>`;btn.textContent="Publier";btn.disabled=false;}
}
window.onload=()=>{const tel=localStorage.getItem('freddy_tel');if(!tel) location.href="connexion.html"; document.getElementById('user').innerText=localStorage.getItem('freddy_nom')||tel;}
</script></head>
<body class="bg-black text-white min-h-screen p-4"><div class="max-w-md mx-auto mt-6">
<h1 class="text-2xl font-black">Publier une vidéo</h1><p class="text-gray-400 text-sm">Connecté en tant que <span id="user" class="font-bold text-white"></span></p>
<div class="bg-white text-black p-6 rounded-2xl mt-4">
<label class="font-bold">Titre de ta vidéo</label><input id="titre" placeholder="Ex: Chantier qui tourne mal - Kolwezi" class="w-full p-3 border rounded-xl mt-1 mb-4">
<label class="font-bold">Lien YouTube ou MP4</label><input id="lien" placeholder="https://youtube.com/..." class="w-full p-3 border rounded-xl mt-1">
<p class="text-xs text-gray-500 mb-4">Colle le lien YouTube de ta vidéo, ou lien MP4</p>
<button id="btnPub" onclick="publier()" class="w-full bg-red-600 text-white p-4 rounded-xl font-black">PUBLIER ET GAGNER 80%</button><div id="msg" class="mt-4"></div></div>
<a href="ma-chaine.html" class="block text-center mt-4 text-gray-400">→ Ma chaîne / Mes revenus</a>
<a href="index.html" class="block text-center mt-2 text-gray-400">← Accueil</a></div></body></html>
