<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Publier - FREDDY-V</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-white p-4">
<a href="index.html" class="bg-red-600 text-white font-black px-3 py-1 rounded">FREDDY-V</a>
<h1 class="font-black text-xl mt-4">Publier vidéo (lien direct)</h1>
<input id="titre" placeholder="Titre *" class="w-full border-2 rounded-xl px-4 py-3 text-sm mt-4">
<input id="file" type="file" accept="video/*" class="w-full border-2 border-dashed rounded-xl px-4 py-6 mt-3">
<button id="btn" onclick="publier()" class="w-full bg-red-600 text-white font-black py-4 rounded-full mt-4">Publier</button>
<p id="msg" class="text-xs text-center mt-3"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM", authDomain: "freddy-v.firebaseapp.com", projectId: "freddy-v", storageBucket: "freddy-v.firebasestorage.app", messagingSenderId: "318263144332", appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9" };
const db = getFirestore(initializeApp(firebaseConfig));

async function uploadCatbox(file){
 const fd=new FormData(); fd.append("reqtype","fileupload"); fd.append("fileToUpload",file);
 const res=await fetch("https://catbox.moe/user/api.php",{method:"POST",body:fd});
 const url=await res.text();
 if(url.startsWith("https://")) return url.trim();
 throw new Error("Catbox: "+url);
}

window.publier=async()=>{
 const titre=document.getElementById('titre').value.trim();
 const file=document.getElementById('file').files[0];
 if(!titre||!file){ alert("Titre + vidéo"); return; }
 const email=localStorage.getItem("freddy_user"); const chaineNom=localStorage.getItem("freddy_chaine")||"Makola Freddy";
 if(!email){ location.href="connexion.html"; return; }
 const handle="@"+chaineNom.toLowerCase().replace(/\s+/g,"");
 document.getElementById('btn').innerText="Upload..."; document.getElementById('btn').disabled=true;
 try{
  const fileUrl=await uploadCatbox(file);
  const docRef=await addDoc(collection(db,"videos"),{titre:titre,url:fileUrl,auteur:chaineNom,chaineHandle:handle,chaineEmail:email,vues:0,likes:0,date:new Date().toISOString()});
  // notifs
  const q=query(collection(db,"abonnements"),where("chaineHandle","==",handle));
  const snap=await getDocs(q); for(const d of snap.docs){ await addDoc(collection(db,"notifications"),{userEmail:d.data().userEmail,titre:titre,chaine:chaineNom,chaineHandle:handle,videoId:docRef.id,videoUrl:fileUrl,lu:false,date:new Date().toISOString()}); }
  document.getElementById('msg').innerText="✅ Publié! Lien direct: "+fileUrl;
  setTimeout(()=>location.href="index.html",1500);
 }catch(e){ document.getElementById('msg').innerText="❌ "+e.message; document.getElementById('btn').disabled=false; document.getElementById('btn').innerText="Réessayer"; }
}
</script>
</body>
</html>
