<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier - FREDDY-V</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-md mx-auto bg-white p-4 rounded-xl">
<h1 class="font-black text-xl mb-4">+ Publier sur FREDDY-V</h1>
<input id="titre" placeholder="Titre de la vidéo" class="w-full border p-3 rounded mb-3">
<input id="url" placeholder="Lien YouTube: https://youtube.com/watch?v=..." class="w-full border p-3 rounded mb-3">
<select id="type" class="w-full border p-3 rounded mb-3">
<option value="video">Vidéo Normale (en bas)</option>
<option value="short">Shorts Vertical (en haut)</option>
</select>
<input id="auteur" value="Makola Freddy" class="w-full border p-3 rounded mb-3">
<button id="btn" class="w-full bg-red-600 text-white p-3 rounded-full font-black">Publier Maintenant</button>
<p id="msg" class="text-center text-sm mt-3"></p>
<a href="index.html" class="block text-center mt-4 text-sm underline">← Retour Accueil</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",
  authDomain: "freddy-v.firebaseapp.com",
  projectId: "freddy-v",
  storageBucket: "freddy-v.firebasestorage.app",
  messagingSenderId: "318263144332",
  appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('btn').onclick = async ()=>{
  const titre = document.getElementById('titre').value;
  const url = document.getElementById('url').value;
  const type = document.getElementById('type').value;
  const auteur = document.getElementById('auteur').value;
  const msg = document.getElementById('msg');
  if(!titre || !url){ msg.innerText = "Remplis titre et lien YouTube!"; return; }
  msg.innerText = "Publication...";
  try{
    await addDoc(collection(db, "videos"), {
      titre: titre,
      url: url,
      type: type,
      auteur: auteur,
      vues: 0,
      timestamp: serverTimestamp()
    });
    msg.innerText = "✅ Publié! Va voir sur Accueil!";
    document.getElementById('titre').value = "";
    document.getElementById('url').value = "";
  }catch(e){ msg.innerText = "Erreur: "+e.message; }
};
</script>
</body>
</html>
