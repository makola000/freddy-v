<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier - FREDDY-V</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",
  authDomain: "freddy-v.firebaseapp.com",
  projectId: "freddy-v",
  storageBucket: "freddy-v.firebasestorage.app",
  messagingSenderId: "318263144332",
  appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.publier = async () => {
  const titre = document.getElementById('titre').value;
  const url = document.getElementById('url').value;
  const type = document.getElementById('type').value;
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  if(!titre || !url){ msg.innerHTML="<div class='bg-red-100 text-red-700 p-3 rounded'>Remplis titre + lien vidéo!</div>"; return; }

  btn.textContent = "Publication...";
  try {
    await addDoc(collection(db, "videos"), {
      titre: titre,
      url: url,
      thumbnail: url,
      type: type,
      auteur: "Makola Freddy",
      vues: 0,
      likes: 0,
      createdAt: serverTimestamp()
    });
    msg.innerHTML = `<div class='bg-green-100 text-green-700 p-4 rounded-xl font-bold'>✅ Vidéo publiée sur FREDDY-V!<br><a href='index.html' class='underline'>Voir sur Accueil YouTube</a></div>`;
    btn.textContent = "Publié!";
  } catch(e){
    msg.innerHTML = `<div class='bg-red-100 text-red-700 p-3 rounded'>Erreur: ${e.message}</div>`;
    btn.textContent = "Réessayer";
  }
};
</script>
</head>
<body class="bg-[#f9f9f9] p-4">
<div class="max-w-md mx-auto bg-white p-6 rounded-2xl mt-6 shadow">
<h1 class="font-black text-xl">📤 Publier sur FREDDY-V</h1>
<p class="text-sm text-gray-500">Comme YouTube - Ta vidéo sera visible sur Accueil</p>

<label class="font-bold text-sm mt-6 block">Titre de la vidéo</label>
<input id="titre" placeholder="Ex: Ma vie à Masisi - Vlog 1" class="w-full p-3 border-2 rounded-xl mt-1">

<label class="font-bold text-sm mt-4 block">Lien de la vidéo (YouTube, MP4, ou lien direct)</label>
<input id="url" placeholder="https://... ou colle lien vidéo" class="w-full p-3 border-2 rounded-xl mt-1">
<p class="text-xs text-gray-400 mt-1">Astuce: Prends un lien MP4 ou YouTube pour test</p>

<label class="font-bold text-sm mt-4 block">Type</label>
<select id="type" class="w-full p-3 border-2 rounded-xl mt-1">
  <option value="video">Vidéo normale (Accueil)</option>
  <option value="short">Shorts Vertical</option>
</select>

<button id="btn" onclick="publier()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black mt-6">🚀 PUBLIER MAINTENANT</button>

<div id="msg" class="mt-4"></div>

<a href="index.html" class="block text-center mt-6 underline">← Retour Accueil</a>
</div>
</body>
</html>
