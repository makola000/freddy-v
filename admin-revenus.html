<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Admin Revenus - FREDDY-V</title>
<style>body{font-family:Arial;padding:20px} table{width:100%;border-collapse:collapse} td,th{border:1px solid #ccc;padding:8px;font-size:13px}</style>
</head><body>
<h2>👑 Admin FREDDY-V - Tes 20%</h2>
<div id="stats" style="background:#ffe;padding:15px;border-radius:10px;margin-bottom:15px"></div>
<h3>Demandes de retrait monde entier</h3>
<table><thead><tr><th>UID</th><th>Pays</th><th>Numéro</th><th>Montant 80%</th><th>Statut</th></tr></thead><tbody id="liste"></tbody></table>
<br><a href="index.html">Retour</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEecIHM",
  authDomain: "freddy-v.firebaseapp.com",
  projectId: "freddy-v",
  storageBucket: "freddy-v.firebasestorage.app",
  messagingSenderId: "318263144332",
  appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function load(){
 let totalVues=0; 
 const videos = await getDocs(collection(db, "videos"));
 videos.forEach(d=> totalVues += (d.data().vues || 0));
 const revenuTotal = totalVues * 0.01;
 const pourToi = revenuTotal * 0.20;
 const pourCreateurs = revenuTotal * 0.80;
 document.getElementById("stats").innerHTML = `Vues totales: <b>${totalVues}</b><br>Revenu Google: $${revenuTotal.toFixed(2)}<br><b style="color:green">TON BÉNÉFICE 20%: $${pourToi.toFixed(2)}</b><br>À payer créateurs 80%: $${pourCreateurs.toFixed(2)}`;

 const retraits = await getDocs(collection(db, "retraits"));
 let html=""; 
 retraits.forEach(d=>{
   const r=d.data();
   html+=`<tr><td>${r.uid.substring(0,8)}..</td><td>${r.pays}</td><td>${r.numero}</td><td>$${r.montant?.toFixed(2)}</td><td>${r.statut}</td></tr>`;
 });
 document.getElementById("liste").innerHTML=html || "<tr><td colspan=5>Aucune demande encore</td></tr>";
}
load();
</script></body></html>
