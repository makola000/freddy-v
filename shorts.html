<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREDDY-V SHORTS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden}
#shorts-container{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.short-item{height:100vh;position:relative;scroll-snap-align:start;background:#000;display:flex;justify-content:center;align-items:center}
.short-item iframe{width:100%;height:100%;border:0;max-width:400px}
.actions-right{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:20px;z-index:5}
.action-btn{background:none;border:none;color:#fff;text-align:center;cursor:pointer}
.action-btn .icon{width:50px;height:50px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;backdrop-filter:blur(10px)}
.action-btn.active .icon{background:#ff3040}
.action-btn span{display:block;font-size:12px;margin-top:4px;font-weight:bold}
.info-bottom{position:absolute;bottom:20px;left:10px;right:80px;z-index:5}
.views-top{position:absolute;top:15px;left:15px;background:rgba(0,0,0,0.6);padding:5px 10px;border-radius:20px;font-size:12px;z-index:5}
header{position:fixed;top:0;left:0;right:0;padding:12px;text-align:center;background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);z-index:10;font-weight:bold}
</style>
</head>
<body>
<header>🔥 SHORTS - FREDDY-V</header>
<div id="shorts-container">Chargement des Shorts...</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase, ref, onValue, runTransaction} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",
  authDomain: "freddy-v.firebaseapp.com",
  databaseURL: "https://freddy-v-default-rtdb.firebaseio.com",
  projectId: "freddy-v",
  storageBucket: "freddy-v.firebasestorage.app",
  messagingSenderId: "318263144332",
  appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function getId(url){
  const m = (url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/))([a-zA-Z0-9_-]+)/);
  return m?m[1]:'';
}

const videosRef = ref(db, 'videos');

onValue(videosRef, snap=>{
  const data = snap.val();
  const container = document.getElementById('shorts-container');
  if(!data){ container.innerHTML='<p style="margin-top:50vh;text-align:center">Aucun Shorts</p>'; return; }
  const liked = JSON.parse(localStorage.getItem('freddy_liked')||'{}');
  const saved = JSON.parse(localStorage.getItem('freddy_saved')||'{}');
  let html='';
  Object.entries(data).filter(([k,v])=> (v.url||'').includes('shorts') || (v.title||'').toLowerCase().includes('short')).reverse().forEach(([key,v])=>{
    const id = getId(v.url);
    html+=`
    <div class="short-item" data-key="${key}">
      <div class="views-top">👁️ ${v.views||0} vues</div>
      <iframe src="https://www.youtube.com/embed/${id}?autoplay=0&loop=1" allowfullscreen></iframe>
      <div class="actions-right">
        <button class="action-btn ${liked[key]?'active':''}" onclick="likeVideo('${key}')"><div class="icon">❤️</div><span>${v.likes||0}</span></button>
        <button class="action-btn" onclick="shareVideo('${key}')"><div class="icon">🔗</div><span>Partager</span></button>
        <button class="action-btn" onclick="downloadVideo('${v.url}')"><div class="icon">⬇️</div><span>Télécharger</span></button>
        <button class="action-btn ${saved[key]?'active':''}" onclick="saveVideo('${key}')"><div class="icon">${saved[key]?'🔖':'📑'}</div><span>Enregistrer</span></button>
      </div>
      <div class="info-bottom"><b>${v.title||'Shorts'}</b><br><small>@${v.author||'Anonyme'} - $0.000</small></div>
    </div>`;
  });
  // Si aucun shorts filtré, montre toutes les vidéos en mode shorts
  if(!html){
    Object.entries(data).reverse().forEach(([key,v])=>{
      const id = getId(v.url);
      html+=`<div class="short-item" data-key="${key}"><div class="views-top">👁️ ${v.views||0} vues</div><iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe><div class="actions-right"><button class="action-btn ${liked[key]?'active':''}" onclick="likeVideo('${key}')"><div class="icon">❤️</div><span>${v.likes||0}</span></button><button class="action-btn" onclick="shareVideo('${key}')"><div class="icon">🔗</div><span>Partager</span></button><button class="action-btn" onclick="downloadVideo('${v.url}')"><div class="icon">⬇️</div><span>Télécharger</span></button><button class="action-btn ${saved[key]?'active':''}" onclick="saveVideo('${key}')"><div class="icon">${saved[key]?'🔖':'📑'}</div><span>Enregistrer</span></button></div><div class="info-bottom"><b>${v.title}</b><br><small>@${v.author} - $0.000</small></div></div>`;
    });
  }
  container.innerHTML=html;
});

window.likeVideo = (key)=>{
  const liked = JSON.parse(localStorage.getItem('freddy_liked')||'{}');
  const r = ref(db, `videos/${key}/likes`);
  if(liked[key]){ delete liked[key]; runTransaction(r, c=>(c||1)-1); }
  else { liked[key]=true; runTransaction(r, c=>(c||0)+1); }
  localStorage.setItem('freddy_liked', JSON.stringify(liked));
};
window.saveVideo = (key)=>{
  const saved = JSON.parse(localStorage.getItem('freddy_saved')||'{}');
  if(saved[key]){ delete saved[key]; alert('Retiré'); } else { saved[key]=true; alert('✅ Enregistré!'); }
  localStorage.setItem('freddy_saved', JSON.stringify(saved));
};
window.shareVideo = (key)=>{
  const link = `https://makola000.github.io/freddy-v/shorts.html?v=${key}`;
  if(navigator.share){ navigator.share({title:'FREDDY-V Shorts', url:link}); }
  else { navigator.clipboard.writeText(link); alert('Lien Shorts copié: '+link); }
};
window.downloadVideo = (url)=>{
  const id = getId(url);
  const dlLink = `https://www.youtube.com/watch?v=${id}`;
  navigator.clipboard.writeText(dlLink);
  alert('Lien copié!');
  window.open(dlLink,'_blank');
};

// Views auto +1 quand on swipe sur un shorts
let observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const key = e.target.dataset.key;
      runTransaction(ref(db, `videos/${key}/views`), c=>(c||0)+1);
    }
  });
},{threshold:0.7});
setTimeout(()=>{
  document.querySelectorAll('.short-item').forEach(el=>observer.observe(el));
},2000);
</script>
</body>
</html>
