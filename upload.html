<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUBLIER - FREDDY-V</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:15px}input,textarea,select{width:100%;padding:12px;margin:8px 0;background:#222;color:#fff;border:1px solid #333;border-radius:8px}button{background:red;color:#fff;padding:14px;width:100%;border:none;border-radius:8px;font-weight:bold;margin-top:10px}</style>
</head><body>
<h2>+ PUBLIER</h2>
<select id="type"><option>📹 Vidéo YouTube (n'importe laquelle)</option></select>
<input id="url" placeholder="https://youtu.be/XXXX" value="https://youtu.be/XkjkuER1EV4?si=CR2JMTGuA-_pn">
<input id="title" placeholder="Titre vidéo" value="David amani">
<input id="name" placeholder="Ton nom" value="Makola Freddy">
<textarea id="desc" placeholder="Description">Like et partager</textarea>
<button onclick="publier()">PUBLIER</button>
<div id="msg" style="margin-top:15px"></div>
<script>
async function publier(){
 let data={
  url:document.getElementById('url').value,
  title:document.getElementById('title').value,
  name:document.getElementById('name').value,
  desc:document.getElementById('desc').value,
  date:Date.now()
 };
 // On sauve dans la base mondiale gratuite
 let res = await fetch('https://api.npoint.io/1a2b3c4d5e6f7g8h9i0j-freddyv', {
  method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
 }).catch(async()=>{
  // Si npoint ne marche pas, on utilise jsonbin fallback
  let r = await fetch('https://freddy-v-default-rtdb.firebaseio.com/videos.json', {
   method:'POST', body:JSON.stringify(data)
  });
  return r;
 });
 document.getElementById('msg').innerHTML = '✅ Publié! <a href="index.html" style="color:red">Voir dans FREDDY-V</a>';
 // Sauve aussi local pour toi
 let local = JSON.parse(localStorage.getItem('freddy_videos')||'[]'); local.push(data); localStorage.setItem('freddy_videos', JSON.stringify(local));
}
</script>
</body></html>
