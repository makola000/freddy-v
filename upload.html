<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publier - FREDDY-V</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><style>body{background:#000;color:#fff;margin:0;font-family:Arial;padding:15px}input,button,select,textarea{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:0;box-sizing:border-box}input,select,textarea{background:#222;color:#fff}button{background:red;color:#fff;font-weight:bold}textarea{height:60px}</style></head><body>
<div onclick="location.href='index.html'">← FREDDY-V</div>
<h3>+ PUBLIER</h3>
<select id="type"><option value="video">📹 Vidéo YouTube (n'importe laquelle)</option><option value="photo">📸 Photo</option><option value="live">🔴 DIRECT LIVE</option></select>
<input id="yturl" placeholder="Lien YouTube OU lien photo">
<input id="titre" placeholder="Titre / Légende">
<input id="auteur" placeholder="Ton nom" value="">
<textarea id="desc" placeholder="Description (facultatif)"></textarea>
<button onclick="publish()">PUBLIER</button>
<div id="msg" style="padding:10px;background:#111;margin-top:10px;border-radius:8px"></div>
<script>
const cfg={apiKey:"AIzaSyCZTfMR94q2t4W1c0N7LK5YpN14M8iBVvA",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.firestore();
function getYTId(u){let m=(u||"").match(/(?:v=|be\/|embed\/|shorts\/|live\/)([^&?\/]+)/);return m?m[1]:"";}
async function publish(){
 const url=document.getElementById('yturl').value.trim();
 const titre=document.getElementById('titre').value.trim()||"Sans titre";
 const auteur=document.getElementById('auteur').value.trim()||"Anonyme";
 const desc=document.getElementById('desc').value.trim();
 const type=document.getElementById('type').value;
 const msg=document.getElementById('msg');
 if(!url){msg.innerHTML="❌ Mets lien";return;}
 let yt=getYTId(url);
 if(type==="photo"){yt=url;}
 if(!yt && type!=="photo"){msg.innerHTML="❌ Lien YouTube invalide";return;}
 msg.innerHTML="⏳ Publication...";
 try{
  await db.collection("videos").add({url:url,youtubeId:yt,titre:titre,auteur:auteur,description:desc,type:type,isLive:type==="live",vues:0,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
  msg.innerHTML="✅ Publié! <a href='index.html' style='color:red'>Voir dans FREDDY-V</a>";
 }catch(e){msg.innerHTML="❌ "+e.message}
}
</script></body></html>
