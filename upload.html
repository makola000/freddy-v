<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Publier - FREDDY-V</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:20px}input,textarea{width:100%;padding:12px;margin:8px 0;background:#111;border:1px solid #333;color:#fff;border-radius:8px}button{background:red;color:#fff;padding:14px;width:100%;border:none;border-radius:8px;font-weight:bold;cursor:pointer; margin-top:10px}#msg{margin-top:15px;text-align:center}</style>
</head><body>
<h2>Publier sur FREDDY-V (Mondial)</h2>
<input id="url" placeholder="Lien YouTube, ex: https://youtu.be/XXXX ou https://youtube.com/shorts/XXXX">
<input id="title" placeholder="Titre de la vidéo">
<input id="name" placeholder="Ton nom: Makola Freddy">
<textarea id="desc" placeholder="Description"></textarea>
<button onclick="publier()">PUBLIER POUR TOUT LE MONDE</button>
<p id="msg"></p>
<a href="index.html" style="color:#aaa">← Retour accueil</a>

<script type="module">
// ===== 4 LIGNES AJOUTÉES POUR COMPTE - RIEN D'AUTRE MODIFIÉ =====
const savedUser = JSON.parse(localStorage.getItem('freddy_user')||'null');
if(savedUser){ 
  setTimeout(()=>{
    const a = document.getElementById('name');
    if(a) a.value = savedUser.username;
  },500);
}
// ===== FIN DES 4 LIGNES =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZTf68dJf0nir7IJ8QCPrVwB4EEEeclHM",
  authDomain: "freddy-v.firebaseapp.com",
  databaseURL: "https://freddy-v-default-rtdb.firebaseio.com",
  projectId: "freddy-v",
  storageBucket: "freddy-v.firebasestorage.app",
  messagingSenderId: "318263144332",
  appId: "1:318263144332:web:387b2ded7cf5b85d6eb0a9"
};

const app = initializeApp(firebaseConfig); 
const db = getDatabase(app);

window.publier = async function(){
  const v = {
    url: document.getElementById('url').value.trim(),
    title: document.getElementById('title').value.trim(),
    name: document.getElementById('name').value.trim(),
    desc: document.getElementById('desc').value.trim(),
    time: Date.now()
  };
  if(!v.url || !v.title){
    document.getElementById('msg').innerText='❌ Remplis lien et titre';
    return;
  }
  document.getElementById('msg').innerText='⏳ Publication mondiale...';
  try {
    await push(ref(db,'videos'), v);
    document.getElementById('msg').innerText='✅ Publié! Tout le monde va voir sur FREDDY-V!';
    setTimeout(()=>location.href='index.html', 1200);
  } catch(e){
    document.getElementById('msg').innerText='❌ Erreur: ' + e.message;
  }
}
</script>
</body></html>
