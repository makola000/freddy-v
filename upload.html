<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publier - FREDDY-V International</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><style>body{background:#000;color:#fff;margin:0;font-family:Arial;padding:15px}input,button,select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:0;box-sizing:border-box}input,select{background:#222;color:#fff}button{background:red;color:#fff;font-weight:bold;font-size:16px} .banner{background:linear-gradient(90deg,red,#900);padding:15px;border-radius:12px;text-align:center;margin-bottom:15px}</style></head><body>
<div class="banner"><b style="font-size:22px">🌍 FREDDY-V INTERNATIONAL</b><br>La plateforme vidéo mondiale</div>
<div style="margin-bottom:10px"><b onclick="location.href='index.html'">← Retour Accueil</b></div>

<h2>📤 Publier une vidéo mondiale</h2>
<select id="type"><option value="video">📹 Vidéo</option><option value="live">🔴 DIRECT LIVE International</option></select>
<input id="yturl" placeholder="Lien YouTube: https://youtu.be/... ou https://youtube.com/live/...">
<input id="titre" placeholder="Titre de ta vidéo (tous pays)">
<input id="auteur" placeholder="Ta chaîne / Nom" value="Makola Freddy">
<input id="pays" placeholder="Pays: Ex: RDC, France, USA, International">

<button onclick="publish()">🌍 PUBLIER INTERNATIONALEMENT</button>
<div id="msg" style="margin:15px 0;padding:15px;background:#111;border-radius:10px;min-height:20px"></div>

<script>
const cfg={apiKey:"AIzaSyCZTfMR94q2t4W1c0N7LK5YpN14M8iBVvA",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.firestore();
function getYTId(u){let m=(u||"").match(/(?:v=|be\/|embed\/|shorts\/|live\/)([^&?\/]+)/);return m?m[1]:"";}
async function publish(){
  const url=document.getElementById('yturl').value.trim();
  const titre=document.getElementById('titre').value.trim();
  const auteur=document.getElementById('auteur').value.trim()||"Makola Freddy";
  const pays=document.getElementById('pays').value.trim()||"International";
  const type=document.getElementById('type').value;
  const msg=document.getElementById('msg');
  if(!url||!titre){msg.innerHTML="❌ Ajoute lien YouTube + titre";return}
  const yt=getYTId(url);
  if(!yt){msg.innerHTML="❌ Lien YouTube invalide";return}
  msg.innerHTML="⏳ Publication internationale...";
  try{
    await db.collection("videos").add({
      url:url, youtubeId:yt, titre:titre, auteur:auteur, pays:pays,
      vues:0, likes:0, type:type, isLive:type==="live",
      timestamp:firebase.firestore.FieldValue.serverTimestamp()
    });
    msg.innerHTML=`✅ 🌍 Publié dans le monde!<br><b>"${titre}"</b> par ${auteur} (${pays})<br><br><a href='index.html' style='color:red;font-weight:bold;font-size:20px'>→ VOIR SUR FREDDY-V INTERNATIONAL</a><br><br>Tout le monde peut maintenant voir ta vidéo, en RDC, en France, aux USA, partout!`;
  }catch(e){msg.innerHTML="❌ "+e.message}
}
</script></body></html>
