<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publier - FREDDY-V</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><style>body{background:#000;color:#fff;margin:0;font-family:Arial;padding:15px}input,button,select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:0;box-sizing:border-box}input,select{background:#222;color:#fff}button{background:red;color:#fff;font-weight:bold}</style></head><body>
<div><b onclick="location.href='index.html'">← FREDDY-V</b></div>
<h2>+ Publier</h2>
<select id="type"><option value="video">Vidéo</option><option value="live">DIRECT LIVE</option></select>
<input id="yturl" placeholder="Lien YouTube (vidéo ou direct)">
<input id="titre" placeholder="Titre">
<input id="auteur" placeholder="Nom / Chaîne" value="Makola Freddy">
<button onclick="publish()">PUBLIER</button>
<div id="msg" style="margin:12px 0;padding:10px;background:#111;border-radius:8px"></div>
<script>
const cfg={apiKey:"AIzaSyCZTfMR94q2t4W1c0N7LK5YpN14M8iBVvA",authDomain:"freddy-v.firebaseapp.com",projectId:"freddy-v"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.firestore();
function getYTId(u){let m=(u||"").match(/(?:v=|be\/|embed\/|shorts\/|live\/)([^&?\/]+)/);return m?m[1]:"";}
async function publish(){
  const url=document.getElementById('yturl').value.trim();
  const titre=document.getElementById('titre').value.trim();
  const auteur=document.getElementById('auteur').value.trim()||"Makola Freddy";
  const type=document.getElementById('type').value;
  const msg=document.getElementById('msg');
  if(!url||!titre){msg.innerHTML="❌ Lien + titre";return}
  const yt=getYTId(url);
  if(!yt){msg.innerHTML="❌ Lien invalide";return}
  msg.innerHTML="⏳ Publication...";
  try{
    await db.collection("videos").add({url:url,youtubeId:yt,titre:titre,auteur:auteur,vues:0,likes:0,type:type,isLive:type==="live",timestamp:firebase.firestore.FieldValue.serverTimestamp()});
    msg.innerHTML=`✅ Publié! ${titre}<br><a href='index.html' style='color:red'>Voir</a>`;
  }catch(e){msg.innerHTML="❌ "+e.message}
}
</script></body></html>
